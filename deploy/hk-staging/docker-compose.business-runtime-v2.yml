services:
  api:
    environment:
      GO_MEDIA_CACHE_DIR: /var/lib/go-hotel/media-cache
    volumes:
      - type: bind
        source: /var/lib/go-hotel/media-cache
        target: /var/lib/go-hotel/media-cache
        bind:
          create_host_path: false
  recovery-worker:
