server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name control.goaidirect.cn;

    ssl_certificate /etc/letsencrypt/live/control.goaidirect.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/control.goaidirect.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / {
        limit_req zone=goai_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name control.goaidirect.cn;
    return 301 https://$host$request_uri;
}
