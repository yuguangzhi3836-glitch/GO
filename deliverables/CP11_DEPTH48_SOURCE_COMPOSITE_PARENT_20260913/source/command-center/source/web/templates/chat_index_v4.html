<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GO AI 指挥中心</title><link rel="stylesheet" href="/static/chat.css"><link rel="stylesheet" href="/static/task-routing.css"><link rel="stylesheet" href="/static/layout.css"></head><body><main class="shell"><header><div class="mark">GO</div><div><p class="eyebrow">PRIVATE COMMAND SURFACE</p><h1>GO AI 指挥中心</h1></div><button id="logout" class="quiet" hidden>退出</button></header><section id="login" class="hero"><p class="eyebrow">SECURE ACCESS</p><h2>把想法，变成<br><em>受控的行动。</em></h2><p>仅限已登记设备。使用 Face ID、指纹或 Windows Hello 进入。</p><button id="sign-in" class="primary">安全进入 <span>→</span></button></section><section id="app" hidden><div class="chat-status"><span class="dot"></span><span>GO AI 协作群</span><span class="separator">·</span><span>你、老板与 GO AI</span><span id="mode-status" class="mode-status">指挥模式 · 不执行</span><span id="usage-summary" class="usage-summary">费用加载中…</span><button id="refresh" class="quiet">刷新</button></div><section class="chat card"><div id="messages" class="messages"></div><div class="chat-compose"><textarea id="task-body" placeholder="输入消息；也可以直接粘贴 GPT 的整段内容…"></textarea><div class="composer-foot"><button id="paste-gpt" class="quiet">粘贴 GPT 内容</button><span id="hint">Enter 发送 · Shift + Enter 换行</span><button id="send-task" class="primary">发送 <span>↑</span></button></div></div></section></section></main><script src="/static/app.js"></script><script src="/static/keybind.js"></script><script src="/static/realtime.js"></script></body></html>
