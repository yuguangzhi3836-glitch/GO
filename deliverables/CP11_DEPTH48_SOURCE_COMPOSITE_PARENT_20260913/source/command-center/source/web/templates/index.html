<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GO AI 指挥中心</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="shell"><header><div class="mark">GO</div><div><p class="eyebrow">PRIVATE COMMAND SURFACE</p><h1>GO AI 指挥中心</h1></div><button id="logout" class="quiet" hidden>退出</button></header><section id="login" class="hero"><p class="eyebrow">SECURE ACCESS</p><h2>把想法，变成<br><em>受控的行动。</em></h2><p>仅限已登记设备。使用 Face ID、指纹或 Windows Hello 进入。</p><button id="sign-in" class="primary">安全进入 <span>→</span></button></section><section id="app" hidden><div class="status"><span class="dot"></span><span>指挥中心在线</span><span class="separator">/</span><span id="who"></span></div><div class="grid"><section class="composer card"><div class="section-top"><div><p class="eyebrow">NEW TASK</p><h2>发起任务</h2></div><button id="paste-gpt" class="quiet">粘贴 GPT 内容</button></div><textarea id="task-body" placeholder="例如：把首页搜索区域重新设计得更干净，不影响原来的搜索功能。"></textarea><div class="composer-foot"><span id="hint">任务不会直接执行；重要动作必须再次确认。</span><button id="send-task" class="primary">提交任务 <span>→</span></button></div></section><section class="feed"><div class="section-top"><div><p class="eyebrow">TASK STREAM</p><h2>任务动态</h2></div><button id="refresh" class="quiet">刷新</button></div><div id="tasks" class="task-list"></div></section></div></section></main><script src="/static/app.js"></script></body></html>
