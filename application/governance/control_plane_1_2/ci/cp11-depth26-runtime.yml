name: CP11 DEPTH26 new backend acceptance
on:
  push:
    branches: [acceptance/cp11-depth26-runtime]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cp11-depth26-runtime
  cancel-in-progress: false
jobs:
  new-backend:
    if: startsWith(github.ref, 'refs/heads/acceptance/cp11-depth26-runtime')
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: go
          POSTGRES_PASSWORD: go-disposable-ci-only
          POSTGRES_DB: go
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U go" --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://go@localhost:5432/go
      PGPASSWORD: go-disposable-ci-only
      DEPTH24_DELTA_PATH: deliverables/CP11_DEPTH24_RUNTIME_CANDIDATE_20260909/GO_CP11_DEPTH_24_UNPAID_EXPIRY_DELTA_20260909.zip
      DEPTH24_DELTA_SHA256: ee71bc8257f75dee49aa77f33816cfb4d07fd45af1fba85e51b4faf6a7f0b03c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Materialize preserved inputs and exact backend overlay
        run: |
          python ci/materialize_depth24.py
          python ci/apply_depth25_overlay.py
          python ci/apply_depth26_overlay.py
      - name: Install existing offline wheels
        run: python -m pip install --no-index --find-links dependencies/wheelhouse -r source/gate_runtime/requirements.lock
      - name: Initialize disposable PostgreSQL at sealed migration head
        working-directory: source
        env:
          DATABASE_URL: postgresql+psycopg://go@localhost:5432/go
          PYTHONPATH: src
        run: python -m alembic upgrade head
      - name: Eight new attraction integrity cases on actual PostgreSQL
        working-directory: source
        env:
          DATABASE_URL: postgresql+psycopg://go@localhost:5432/go
          PYTHONPATH: src
        run: python -m pytest ../ci/gate_tests/test_depth26_attraction_terms.py --junitxml=../evidence/attraction_postgres.xml
      - name: Twenty-four control journal and receipt cases
        working-directory: source
        run: python -m pytest tests/test_depth26_control_bridge.py --junitxml=../evidence/control_bridge.xml
      - name: Record exact new-test evidence
        if: always()
        env:
          PRIOR_STEPS_STATUS: ${{ job.status }}
        run: python ci/finish_depth26.py
      - name: Archive original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GO-CP11-DEPTH26-new-backend-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 90
