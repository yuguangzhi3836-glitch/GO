<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GO 隐私与数据权利</title><style>body{max-width:720px;margin:24px auto;padding:16px;font:16px system-ui;color:#12213c}button,select,a{font:inherit;min-height:44px;margin:6px}section{padding:16px;border:1px solid #ddd;border-radius:12px;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}#message{color:#8b2500}</style></head><body><h1>隐私与数据权利</h1><p>登录后可查看本人的注册确认记录、申请查阅、更正、删除、撤回、注销、限制处理或转移资料。提交申请不表示处理已经完成。</p><a id="back">返回 GO</a><p id="message" role="status"></p><section><h2>提交申请</h2><label>申请类型 <select id="kind"><option value="ACCESS">查阅 / 复制</option><option value="CORRECTION">更正</option><option value="DELETION">删除</option><option value="WITHDRAWAL">撤回同意</option><option value="CLOSURE">注销账号</option><option value="RESTRICTION">限制处理</option><option value="TRANSFER">转移资料</option></select></label><button id="submit" disabled>提交申请</button><p>请勿在申请中提交密码、验证码或证件原文。需要补充资料时，由受理人员通过已核实渠道联系。</p></section><section><h2>注册确认记录与申请进度</h2><pre id="records"></pre></section><section id="vaultSection" hidden><h2>旅行资料授权</h2><p>可立即撤回尚在生效的旅行资料授权。已依法产生的订单或审计记录须按其保留要求另行处理。</p><div id="vault"></div></section><script src="privacy.js"></script></body></html>
