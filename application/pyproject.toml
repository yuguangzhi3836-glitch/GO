[project]
name = "go-hotel-platform"
version = "1.5.0"
description = "GO Hotel Vertical Alpha - Sprint 1W Staging, CI/CD, PostgreSQL 16, Redis Queue, Prometheus/Grafana and Release Pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "Pillow>=10",
  "cryptography>=43",
  "PyJWT[crypto]>=2.9",
  "redis>=5.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:ddtrace"
markers = [
  "postgres: requires POSTGRES_TEST_DATABASE_URL pointing to PostgreSQL",
  "concurrency: concurrency/resilience test",
  "no_db: static/contract test that does not require database reset",
  "integration: runtime/API integration tests; may depend on application lifecycle"
]


[tool.setuptools.package-data]
go_hotel = ["legal/registration/*/*.md", "legal/registration/*/*.json"]
