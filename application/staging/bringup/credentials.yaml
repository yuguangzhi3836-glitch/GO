release: GO Mobile Sprint 2D
policy:
  secrets_must_not_be_committed: true
  evidence_must_not_contain_secrets: true
  production_store_build_requires_all_blocking_gates: true
credentials:
  - id: STAGING_DATABASE
    required_for: [PG16]
    secret_names: [STAGING_DATABASE_URL]
    description: PostgreSQL 16 TLS connection URL for GO staging.
  - id: STAGING_REDIS
    required_for: [REDIS]
    secret_names: [STAGING_REDIS_URL]
    description: Redis TLS connection URL for GO staging queues/outbox.
  - id: PSP_SANDBOX
    required_for: [PSP]
    secret_names: [PSP_PROVIDER, PSP_SANDBOX_API_KEY]
    optional_names: [PSP_SANDBOX_BASE_URL, PSP_SANDBOX_HEALTH_URL]
    description: Real chosen PSP sandbox credentials. Provider-specific contract remains in its adapter.
  - id: HOTEL_CONNECTOR_SANDBOX
    required_for: [CONNECTOR]
    secret_names: [REAL_CONNECTOR_ID, REAL_CONNECTOR_BASE_URL, REAL_CONNECTOR_CREDENTIAL]
    description: Contracted hotel connector sandbox credentials and endpoint base URL.
  - id: EXPO
    required_for: [APPLE_SIGNING, GOOGLE_SIGNING, TESTFLIGHT, PLAY_INTERNAL]
    secret_names: [EXPO_TOKEN, EXPO_PUBLIC_EAS_PROJECT_ID]
    description: Expo account token and EAS project identifier.
  - id: APPLE_STORE
    required_for: [APPLE_SIGNING, TESTFLIGHT]
    secret_names: [APPLE_TEAM_ID, ASC_APP_ID, ASC_API_KEY_ID, ASC_API_KEY_ISSUER_ID, ASC_API_KEY_PATH]
    description: Apple Developer/App Store Connect signing and API automation inputs.
  - id: GOOGLE_PLAY
    required_for: [GOOGLE_SIGNING, PLAY_INTERNAL]
    secret_names: [GOOGLE_PLAY_PACKAGE_NAME, GOOGLE_PLAY_SERVICE_ACCOUNT_JSON]
    description: Google Play app package and service account JSON path.
  - id: FIREBASE_FCM
    required_for: [FCM]
    secret_names: [FIREBASE_PROJECT_ID, FIREBASE_SERVICE_ACCOUNT_JSON]
    description: Firebase project and service account for FCM HTTP v1/Admin SDK.
  - id: APPLE_PUSH
    required_for: [APNS]
    secret_names: [APPLE_TEAM_ID, APNS_KEY_ID, APNS_AUTH_KEY_PATH]
    description: APNs token signing key if APNs is managed outside EAS credentials.
  - id: GO_DOMAIN
    required_for: [UNIVERSAL_LINK, APP_LINK]
    secret_names: []
    required_names: [GO_APP_DOMAIN, IOS_BUNDLE_ID, ANDROID_PACKAGE_NAME, ANDROID_SHA256_CERT_FINGERPRINT]
    description: Production application domain and platform app identifiers.

ci_file_secret_materialization:
  ASC_API_KEY_B64: ASC_API_KEY_PATH
  APNS_AUTH_KEY_B64: APNS_AUTH_KEY_PATH
  GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
  FIREBASE_SERVICE_ACCOUNT_JSON_B64: FIREBASE_SERVICE_ACCOUNT_JSON
