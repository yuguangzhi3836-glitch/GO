name: DEPTH48 ordered repair acceptance
on:
  pull_request:
    branches: [main, cell/c02-pr202-three-end-selfcheck-20260918]
    paths:
      - application/**
      - ci/depth47/**
      - ci/journey-v2/**
      - ci/retention/**
      - .github/workflows/depth47-module-boundaries.yml
      - evidence/c02-pr202-flight-trigger/**
permissions:
  contents: read
concurrency:
  group: depth47-boundaries-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    if: ${{ github.event.pull_request.number != 181 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Verify unique source and complete inherited file set
        run: python -B ci/journey-v2/prepare.py
      - name: Install parent-bound Python dependencies and pinned browser
        run: |
          python ci/retention/dependencies.py --repository . --output "$RUNNER_TEMP/frozen"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/frozen/wheelhouse" -r ci/retention/requirements.lock
          npm install --no-save --ignore-scripts playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Three actor API refresh relogin and independent SQL audit
        run: python -B ci/journey-v2/same_order_api.py journey-evidence/same-order-api journey-evidence/source-binding.json
      - name: Consumer supplier administrator same-order journeys
        run: python -B ci/journey-v2/run.py
      - name: Hash public evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('journey-evidence');p.mkdir(exist_ok=True)
          files={str(x.relative_to(p)):hashlib.sha256(x.read_bytes()).hexdigest() for x in sorted(p.rglob('*')) if x.is_file() and x.name!='SHA256.json'}
          (p/'SHA256.json').write_text(json.dumps(files,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depth47-browser-${{ github.event.pull_request.head.sha }}
          path: journey-evidence/
          if-no-files-found: error
          retention-days: 90

  postgres:
    if: ${{ github.event.pull_request.number != 181 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: go_ci
          POSTGRES_USER: go_ci
          POSTGRES_PASSWORD: isolated_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U go_ci -d go_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Bind exact application source
        run: |
          python ci/retention/verify_source.py "$RUNNER_TEMP/postgres-evidence/source"
          python ci/retention/verify_alignment.py "$RUNNER_TEMP/postgres-evidence/alignment.json"
      - name: Install frozen parent-bound dependencies
        run: |
          python ci/retention/dependencies.py --repository . --output "$RUNNER_TEMP/frozen"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/frozen/wheelhouse" -r ci/retention/requirements.lock
      - name: Migrate disposable PostgreSQL and verify six unskipped concurrency checks
        env:
          PYTHONPATH: application/src
        run: python -B ci/depth47/postgres.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depth47-postgres-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/postgres-evidence
          if-no-files-found: error
          retention-days: 90

  c02-exact-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GO_TEST_DB_PATH: ${{ runner.temp }}/go-c02-three-end.db
      REQUIRED_BASE_SHA: cd6345e32dd258c7f11f0766a36a168bad99a7f5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind PR202 ancestry and exact application tree
        run: |
          git merge-base --is-ancestor "$REQUIRED_BASE_SHA" HEAD
          mkdir -p "$RUNNER_TEMP/c02-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/c02-evidence/candidate-sha.txt"
          git rev-parse HEAD:application > "$RUNNER_TEMP/c02-evidence/application-tree.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated application dependencies
        working-directory: application
        run: python -m pip install -e '.[dev]'
      - name: Execute only C02 idempotency, identity and airport resolver tests
        id: c02
        working-directory: application
        run: |
          set +e
          PYTHONPATH=src python -m pytest             tests/flight/test_c02_three_end_change_quote.py             tests/flight/test_c02_airport_resolver.py             -p no:cacheprovider -q             --junitxml="$RUNNER_TEMP/c02-evidence/junit.xml"             > "$RUNNER_TEMP/c02-evidence/test.log" 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/c02-evidence/test.log"
          exit "$rc"
      - name: Seal C02 evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'c02-evidence'
          files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.glob('*')) if p.is_file()}
          result={'cell':'C02','required_base_sha':os.environ['REQUIRED_BASE_SHA'],
            'candidate_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'application_tree':subprocess.check_output(['git','rev-parse','HEAD:application'],text=True).strip(),
            'test_exit_code':int('${{ steps.c02.outputs.exit_code || 99 }}'),'files':files,
            'evidence_sections':['change_quote_idempotency_and_three_end_identity','multilingual_airport_resolution'],
            'hong_kong':'NOT_ACCESSED','production':'HOLD','real_supplier':'DISABLED','real_payment':'DISABLED'}
          (out/'binding.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
          (cd "$RUNNER_TEMP/c02-evidence" && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c02-pr202-flight-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/c02-evidence
          if-no-files-found: error
          retention-days: 90
