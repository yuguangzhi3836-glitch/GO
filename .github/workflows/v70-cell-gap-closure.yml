name: V7 Cell scoped gap closure
on:
  pull_request:
    branches: [main]
    paths:
      - .github/historical-gates/v70-cell-gap-closure.json
      - ci/retention/**
      - ci/cell-closure/**
      - ci/round2/**
      - ci/next-depth/**
      - ci/admin-pagination/**
      - .github/workflows/v70-cell-gap-closure.yml
permissions:
  contents: read
concurrency:
  group: v70-cell-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scoped-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        id: stage_01
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: stage_02
        with:
          python-version: '3.13.5'
      - name: Verify exact candidate and retained baseline
        id: stage_03
        run: |
          python ci/retention/verify_source.py "$RUNNER_TEMP/cell-evidence/source"
          python ci/retention/verify_alignment.py "$RUNNER_TEMP/cell-evidence/alignment.json"
          python - <<'PY'
          import json, os, pathlib, subprocess
          c=json.loads(pathlib.Path('ci/cell-closure/CANDIDATE.json').read_text())
          actual=subprocess.check_output(['git','rev-parse','HEAD:application'],text=True).strip()
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'cell-evidence/source/RETENTION_RESULT.json').read_text())
          assert actual==c['application_git_tree']
          assert r['source_tree_sha256']==c['source_tree_sha256']
          assert r['source_files']==c['source_files']
          assert c['production']=='HOLD' and c['full_release']=='HOLD'
          PY
      - name: Install inherited frozen Python dependencies
        id: stage_04
        run: |
          python ci/retention/dependencies.py --repository . --output "$RUNNER_TEMP/frozen"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/frozen/wheelhouse" -r ci/retention/requirements.lock
      - name: Scoped tests in fresh processes with normal worker settings
        id: stage_05
        run: |
          set -euo pipefail
          files=(
            tests/autonomy/test_c14_release_evidence_guards.py
            tests/test_c01_hosted_fare_value_integrity.py
            tests/test_c04_refund_terminal_integrity.py
            tests/go_ai/test_c08_synthesis_audit_finalization.py
            tests/journey/test_c10_current_status_projection.py
            tests/test_c11_idempotency_completion_guard.py
            tests/test_depth48_capacity.py
            tests/go_ai/test_c08_audit_commit_failure.py
            tests/journey/test_c10_attachment_canonical_facts.py
            tests/judgment/test_round2_evidence_authority.py
            tests/test_round2_c07_explicit_preferences.py
            tests/test_v70_round2_c01_mixed_funding.py
            tests/test_v70_round2_c02_partial_party.py
            tests/test_v70_round2_c04_rental_receipts.py
            tests/test_v70_round2_c05_recovery_fulfillment.py
            tests/go_ai/test_c08_hard_exit_recovery.py
            tests/journey/test_c10_batch_list_projection.py
            tests/judgment/test_next_depth_concurrent_judgment.py
            tests/payments/test_c11_flight_idempotency_recovery.py
            tests/test_next_depth_c03_payment_inventory_races.py
            tests/test_next_depth_c06_supplier_validity.py
            tests/test_round2_c07_process_recovery.py
            tests/test_v70_next_c01_unknown_funding.py
            tests/test_v70_next_c02_coupon_plan.py
            tests/test_v70_next_c04_readonly_reconciliation.py
            tests/test_v70_next_c05_recovery_evidence.py
          )
          for file in "${files[@]}"; do
            name=$(basename "$file" .py)
            (cd application && GO_TEST_DB_PATH="$RUNNER_TEMP/$name.db" python -m pytest -p no:cacheprovider "$file" --junitxml="$RUNNER_TEMP/cell-evidence/$name.xml")
          done
          PYTHONPATH=application/src python -m pytest -p no:cacheprovider ci/admin-pagination/test_pagination.py --junitxml="$RUNNER_TEMP/cell-evidence/admin-pagination.xml"
      - name: Round 2 scheduler consistency regression
        id: stage_06
        shell: bash
        run: python -m unittest discover -s ci/round2 -p test_validate_ledger.py -v 2>&1 | tee "$RUNNER_TEMP/cell-evidence/scheduler.log"
      - name: Next depth receipt admission and actual execution records
        id: stage_07
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest ci/round2/test_validate_ledger.py -k receipt -p no:cacheprovider --junitxml "$RUNNER_TEMP/cell-evidence/receipt-tests.xml"
          for cell in C08 C10 C12; do
            lower=$(echo "$cell" | tr '[:upper:]' '[:lower:]')
            python ci/round2/verify_execution_receipt.py "evidence/v70-next-depth-20260914/$lower/ACK_RECEIPT.json" --evidence-root . --expected-cell "$cell" --expected-task "V70-R2-$cell-02" --expected-agent /root/c12_scheduler | tee "$RUNNER_TEMP/cell-evidence/$lower-receipt-admission.json"
          done
      - name: Bind original result files to this checkout
        id: stage_08
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'cell-evidence';out.mkdir(exist_ok=True)
          files={str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file()}
          result={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'application_git_tree':subprocess.check_output(['git','rev-parse','HEAD:application'],text=True).strip(),'files':files,'scope':'isolated scoped tests only','hong_kong':'NOT_ACCESSED','production':'HOLD','full_release':'HOLD'}
          (out/'EVIDENCE_BINDING.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Record acceptance stage outcomes
        if: always()
        env:
          GO_CI_STEPS: ${{ toJSON(steps) }}
        run: python ci/retention/write_stage_receipt.py "${{ runner.temp }}/cell-evidence/STAGE_RECEIPT.json"
      - uses: actions/upload-artifact@v4
        id: stage_09
        if: always()
        with:
          name: v70-cell-closure-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/cell-evidence
          if-no-files-found: error
          retention-days: 90
