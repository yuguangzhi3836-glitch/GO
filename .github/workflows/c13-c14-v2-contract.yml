name: C13-C14 v2 contract checks

on:
  pull_request:
    paths:
      - control-plane/c13-c14-v2/**
      - .github/workflows/c13-c14-v2-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check scoped admission refusals
        run: python -m unittest discover -s control-plane/c13-c14-v2 -p 'test_*.py' -v
