name: Boss deployment request entry (isolated)
on:
  push:
    branches: [feature/boss-deploy-request-v1-20260912]
    paths: ['control-plane/boss-deploy-request-v1/**', '.github/workflows/boss-deploy-request-v1.yml']
  pull_request:
    branches: [main]
    paths: ['control-plane/boss-deploy-request-v1/**', '.github/workflows/boss-deploy-request-v1.yml']
permissions:
  contents: read
concurrency:
  group: boss-deploy-entry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  isolated-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned test dependency
        run: python -m pip install cryptography==46.0.0
      - name: Check source manifest
        working-directory: control-plane/boss-deploy-request-v1
        run: sha256sum -c SHA256SUMS
      - name: Run checks with network and runtime paths forbidden
        run: python control-plane/boss-deploy-request-v1/run_checks.py "$RUNNER_TEMP/deploy-entry-checks"
      - name: Build review package and bind tested commit
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path('control-plane/boss-deploy-request-v1')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'deploy-entry-checks'
          package=out/'boss-deploy-request-v1.zip'
          with zipfile.ZipFile(package,'w',compression=zipfile.ZIP_DEFLATED) as z:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and '__pycache__' not in path.parts:
                      info=zipfile.ZipInfo(str(path.relative_to(root)),date_time=(2026,9,12,0,0,0))
                      info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16
                      z.writestr(info,path.read_bytes())
          binding={'event':os.environ['GITHUB_EVENT_NAME'],'workflow_commit':os.environ['GITHUB_SHA'],
                   'run_id':os.environ['GITHUB_RUN_ID'],'package_sha256':hashlib.sha256(package.read_bytes()).hexdigest(),
                   'installation_performed':False,'deployment_performed':False}
          (out/'binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          print(json.dumps(binding,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boss-deploy-entry-${{ github.sha }}
          path: ${{ runner.temp }}/deploy-entry-checks/
          if-no-files-found: error
          retention-days: 30
