name: TEMP C14 stage-boundary validation

on:
  pull_request:
    paths:
      - 'control-plane/c13-c14-lite/**'
      - '.github/workflows/c14-stage-boundary-temp-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python -m py_compile control-plane/c13-c14-lite/lite_ai_reviewer.py
          python -m py_compile control-plane/c13-c14-lite/test_lite_review_brief.py
      - name: Review Brief and reviewer standard tests
        working-directory: control-plane/c13-c14-lite
        run: python -m unittest -v test_lite_review_brief.py
