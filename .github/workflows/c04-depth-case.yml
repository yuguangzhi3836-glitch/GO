name: C04 read-only evidence-time provenance
on:
  pull_request:
    branches: [integration/v70-final-scoped-20260916]
  push:
    branches: [cell/c04-v70-r3-03-evidence-time]
permissions:
  contents: read
jobs:
  c04:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install frozen dependencies
        run: |
          python ci/retention/dependencies.py --repository . --output "$RUNNER_TEMP/frozen"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/frozen/wheelhouse" -r ci/retention/requirements.lock
      - name: Run focused zero-write tests
        run: |
          mkdir -p evidence-out
          cd application
          set -o pipefail
          python -m pytest -p no:cacheprovider tests/test_v70_r3_c04_admin_reconciliation.py -vv --junitxml=../evidence-out/junit.xml 2>&1 | tee ../evidence-out/raw.log
          cd ..
          git rev-parse HEAD | tee evidence-out/candidate.txt
          git rev-parse HEAD:application | tee evidence-out/application-tree.txt
          sha256sum evidence-out/raw.log evidence-out/junit.xml > evidence-out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: c04-read-only-evidence-time
          path: evidence-out
          retention-days: 90
