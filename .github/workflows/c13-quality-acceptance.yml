name: C13 quality acceptance (Lite V2)

# C13 = independent quality acceptance. It is deliberately split into two jobs
# with different credential boundaries:
#
#   c13-machine-test  executes candidate code in a disposable container
#                     (Docker + PostgreSQL 18.4). It never sees OPENAI_API_KEY and
#                     holds no deployment credential.
#   c13-ai-review     runs the fresh AI review. It executes no candidate code, runs
#                     no Docker and touches no database. It has the AI credential
#                     and nothing else.
#
# The C14 prerequisite gate runs before any formal C13 acceptance is formed, and
# the whole round is re-verified from the received bytes before the bundles are
# published. authorizes_any_action stays false everywhere.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Frozen candidate commit SHA (40 hex) - never a branch head"
        required: true
      application_tree:
        description: "Frozen application/ subtree SHA"
        required: true
      issue_number:
        description: "Existing issue / ledger issue number"
        required: true
      request_id:
        description: "Scheduler request id that dispatched this task"
        required: true
      ledger_round_id:
        description: "round_id of the ledger record"
        required: true
      c14_task_id:
        description: "C14 task id in that ledger"
        required: true
      c13_task_id:
        description: "C13 task id in that ledger"
        required: true
      c14_run_id:
        description: "GitHub run id of the C14 review for the SAME candidate"
        required: true
      machine_inventory:
        description: "Frozen machine-test inventory path inside the candidate"
        required: false
        default: "application/tests"
      ai_model:
        description: "Model used for the fresh AI review execution"
        required: false
        default: "gpt-5.6-sol"

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  LITE_CELL_PAIR: "C13+C14"
  LITE_WORKFLOW_IDENTITY: ".github/workflows/c13-quality-acceptance.yml"
  LITE_AI_MODEL: ${{ inputs.ai_model }}

jobs:
  c13-machine-test:
    name: C13 machine test (disposable Docker + PostgreSQL 18.4, no AI credential)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: c13-lite-local-only
          POSTGRES_DB: c13_lite
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out the execution backend (this run's own commit)
        uses: actions/checkout@v4
        with:
          # EXECUTION_BACKEND_SHA = github.sha: the backend that runs is the backend
          # registered on the ref this run used, and that commit is what GitHub records as
          # the run's head_sha. The backend used to be a literal commit SHA that only lived
          # on an unmerged working branch: nothing on the default branch showed that
          # dependency, and deleting the branch broke the first checkout of the next
          # dispatch. Nothing outside the default branch now has to stay alive.
          #
          # This is NOT the reviewed candidate - the candidate is checked out separately at
          # candidate_sha and the two are never assumed to be equal. It is also deliberately
          # not a dispatch input: workflow_dispatch allows at most 10 inputs and the
          # ledger-bound identity fields use all of them.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the frozen candidate into candidate/
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bind the exact frozen candidate identity
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
          test "$(git -C candidate rev-parse HEAD:application)" = "${{ inputs.application_tree }}"

      - name: Run the frozen machine inventory in a disposable container
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/machine"
          # The inventory imports what the CANDIDATE declares, so the candidate's own
          # project is installed first - from application/pyproject.toml, never from a
          # package list written up here. Without it the machine test cannot even collect:
          # test_deploy_entry.py needs cryptography, which only the candidate's pyproject
          # declares (measured, CCV1-147A). A list written in this file would be the same
          # defect one level down, so the candidate's declaration is the only source.
          #
          # It is built from a writable COPY of that directory, not from /srv: the candidate
          # has no [build-system], so setuptools takes the legacy path and writes
          # <name>.egg-info INSIDE the project directory - `pip install "/srv/application[dev]"`
          # fails with "could not create 'src/go_hotel_platform.egg-info': Read-only file
          # system" on the read-only mount (measured). The copy is the only writable thing;
          # the candidate itself stays read-only and the tests still run against /srv.
          docker run --rm \
            -v "$PWD/candidate:/srv:ro" \
            -v "$RUNNER_TEMP/machine:/out" \
            -e PGHOST=host.docker.internal \
            -e PGPORT=5432 \
            -e PGUSER=postgres \
            -e PGPASSWORD=c13-lite-local-only \
            -e PGDATABASE=c13_lite \
            -e DATABASE_URL="postgresql+psycopg://postgres:c13-lite-local-only@host.docker.internal:5432/c13_lite" \
            -w /srv \
            --add-host=host.docker.internal:host-gateway \
            python:3.12-slim \
            bash -lc 'pip install -q pytest && cp -r /srv/application /tmp/candidate-application && pip install -q "/tmp/candidate-application[dev]" && python -m pytest "${{ inputs.machine_inventory }}" -q --junitxml=/out/junit.xml' \
            2>&1 | tee "$RUNNER_TEMP/machine/stdout.txt"
          test -s "$RUNNER_TEMP/machine/junit.xml"

      - name: Record the machine-test manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "machine"
          def sha(name):
              return hashlib.sha256((root / name).read_bytes()).hexdigest()
          manifest = {
              "inventory": "${{ inputs.machine_inventory }}",
              "postgres_version": "18.4",
              "docker_used": True,
              "junit_sha256": sha("junit.xml"),
              "stdout_sha256": sha("stdout.txt"),
              "candidate_sha": "${{ inputs.candidate_sha }}",
              "application_tree": "${{ inputs.application_tree }}",
              "authorizes_any_action": False,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          (root / "test_inventory.txt").write_text("${{ inputs.machine_inventory }}\n")
          PY

      - name: Publish the machine-test evidence
        uses: actions/upload-artifact@v4
        with:
          name: c13c14-lite-c13-machine-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/machine
          if-no-files-found: error
          retention-days: 90

  c13-ai-review:
    name: C13 fresh AI quality review (no candidate execution, no Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: c13-machine-test
    steps:
      - name: Check out the execution backend (this run's own commit)
        uses: actions/checkout@v4
        with:
          # EXECUTION_BACKEND_SHA = github.sha: the backend that runs is the backend
          # registered on the ref this run used, and that commit is what GitHub records as
          # the run's head_sha. The backend used to be a literal commit SHA that only lived
          # on an unmerged working branch: nothing on the default branch showed that
          # dependency, and deleting the branch broke the first checkout of the next
          # dispatch. Nothing outside the default branch now has to stay alive.
          #
          # This is NOT the reviewed candidate - the candidate is checked out separately at
          # candidate_sha and the two are never assumed to be equal. It is also deliberately
          # not a dispatch input: workflow_dispatch allows at most 10 inputs and the
          # ledger-bound identity fields use all of them.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the frozen candidate into candidate/ (never executed)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          # Needed to freeze the changed-path boundary below: the first-parent diff cannot be
          # computed without the first parent, and a depth-1 checkout yields an EMPTY boundary
          # with exit code 0 - the same silent degradation as the diff-tree bug (CCV1-145B D-1).
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch the C14 prerequisite bundle for the same candidate
        uses: actions/download-artifact@v4
        with:
          name: c13c14-lite-c14-${{ inputs.candidate_sha }}
          path: c14-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.c14_run_id }}

      - name: Fetch the C13 machine-test evidence
        uses: actions/download-artifact@v4
        with:
          name: c13c14-lite-c13-machine-${{ inputs.candidate_sha }}
          path: machine-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Bind the frozen candidate and its machine evidence
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
          test "$(git -C candidate rev-parse HEAD:application)" = "${{ inputs.application_tree }}"
          mkdir -p "$RUNNER_TEMP/artifacts"
          # A merge commit is NOT diffed by `git diff-tree` unless a merge diff mode is selected,
          # so the plain form printed NOTHING for a merge commit and the frozen changed-path
          # boundary was silently empty (CCV1-145B D-1).
          #   * `-m` is NOT the fix, and neither is `-m --first-parent`: `--first-parent` does not
          #     narrow `-m`'s output, so the boundary silently becomes the union of BOTH parents'
          #     diffs (measured).
          #   * `--diff-merges=first-parent` is the boundary we want: what this candidate brings
          #     into its own line. It is a no-op for an ordinary single-parent commit.
          # The first parent must also be present locally - that is why the candidate checkout in
          # the c13-ai-review job uses fetch-depth 2. At depth 1 the boundary is empty again,
          # with exit code 0.
          git -C candidate diff-tree --no-commit-id --name-only -r --diff-merges=first-parent HEAD | sort -u > "$RUNNER_TEMP/changed_paths.txt"
          # Fail closed, and never swallow a failure with `|| true`.
          test -s "$RUNNER_TEMP/changed_paths.txt"
          # WHAT changed, not only which paths: the reviewer is asked to judge content, and the
          # first real Review E2E handed the model an empty change surface while the frozen scope
          # carried eight paths - it faithfully answered NOT_APPLICABLE for "no changed paths"
          # (CCV1-147B; proved by recomputing both digests, and nothing failed because every
          # digest still recomputed). These are git's own bytes for the frozen candidate's
          # first-parent diff. No diff authority, no signature and no second registry: GitHub
          # already owns commit identity.
          git -C candidate diff --no-ext-diff --no-color HEAD^1 HEAD > "$RUNNER_TEMP/candidate.diff"
          test -s "$RUNNER_TEMP/candidate.diff"
          wc -c < "$RUNNER_TEMP/candidate.diff"
          cp c14-input/c14_bundle.json "$RUNNER_TEMP/c14_bundle.json"
          cp machine-input/junit.xml machine-input/stdout.txt machine-input/manifest.json machine-input/test_inventory.txt "$RUNNER_TEMP/"
          cp c14-input/c14_contract.json "$RUNNER_TEMP/c14.contract.json"
          wc -l "$RUNNER_TEMP/test_inventory.txt"

      - name: Resolve the review brief from the candidate's own pull request (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # WHAT WAS ASKED FOR, not only what changed. Until now C13 could see the change
          # surface, the diff, the acceptance criteria and the machine evidence but not the task
          # the candidate was given - so "is this acceptable for the task" was being answered
          # against the reviewer's own best practice. The brief is the candidate's own pull
          # request, frozen as GitHub's raw facts by the commit -> pull requests API. The match
          # must be unique (the candidate is that PR's head sha or its merge commit sha); zero or
          # several matches is a refusal, never a guess. It is resolved from the same frozen
          # candidate SHA C14 used, so both cells grade the same paper. This step exits 0 even on
          # a refusal, on purpose: the refusal is a *record*, and `spec` below stops the round on
          # it - so the reason survives instead of being lost in a crashed step.
          python control-plane/c13-c14-lite/lite_cli.py review-brief \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --repository "$GITHUB_REPOSITORY" \
            --out "$RUNNER_TEMP/review_brief.json"

      - name: Bind the workflow definition that is actually executing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # NOT `git rev-parse HEAD:$LITE_WORKFLOW_IDENTITY`. The workspace root is the backend
          # checkout, which is this run's own commit - but the identity must still be resolved
          # from the ref the run used and checked against the API's own bytes, because that is the
          # definition GitHub registered for this run, and a later edit to it must move the digest
          # (CCV1-145B D-2). Resolve it from GITHUB_SHA. The helper re-hashes the returned bytes
          # into git's own blob SHA and exits non-zero on any mismatch, because an unbound
          # workflow identity must stop the round, never fall back to something plausible.
          echo "LITE_WORKFLOW_SHA=$(python control-plane/c13-c14-lite/lite_cli.py workflow-identity \
            --path "$LITE_WORKFLOW_IDENTITY" --ref "${GITHUB_SHA}")" >> "$GITHUB_ENV"

      - name: Freeze the quality-test scope and the dispatch environment
        run: |
          set -euo pipefail
          {
            echo "LITE_CANDIDATE_SHA=${{ inputs.candidate_sha }}"
            echo "LITE_APPLICATION_TREE=${{ inputs.application_tree }}"
            echo "LITE_ISSUE_NUMBER=${{ inputs.issue_number }}"
            echo "LITE_REQUEST_ID=${{ inputs.request_id }}"
            echo "LITE_LEDGER_ROUND_ID=${{ inputs.ledger_round_id }}"
            echo "LITE_C14_TASK_ID=${{ inputs.c14_task_id }}"
            echo "LITE_C13_TASK_ID=${{ inputs.c13_task_id }}"
            echo "LITE_WORKFLOW_SHA=$LITE_WORKFLOW_SHA"
            echo "LITE_NONCE=c13-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$RANDOM"
            echo "LITE_RUN_ID=${GITHUB_RUN_ID}"
            echo "LITE_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "LITE_PRINCIPAL_ID=${GITHUB_ACTOR}"
            echo "LITE_TEST_INVENTORY_SHA256=$(sha256sum "$RUNNER_TEMP/test_inventory.txt" | cut -d' ' -f1)"
            echo "LITE_ISSUED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "LITE_EXPIRES_AT=$(date -u -d '+55 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
          python control-plane/c13-c14-lite/lite_cli.py scope \
            --role c13 \
            --changed-paths "$RUNNER_TEMP/changed_paths.txt" \
            --inventory "$RUNNER_TEMP/test_inventory.txt" \
            --criterion "every required negative case refuses" \
            --out "$RUNNER_TEMP/scope.json" > /dev/null
          echo "LITE_SCOPE_SHA256=$(grep -o '[0-9a-f]\{64\}' "$RUNNER_TEMP/scope.json" | head -1)" >> "$GITHUB_ENV"

      - name: Build the frozen candidate contract
        run: |
          set -euo pipefail
          # The reviewer gets the change surface, the content, the acceptance criteria and the
          # machine evidence the machine job actually produced; all four are files this run
          # already has, so none of them became a dispatch input. Without them the facts carried
          # an empty change surface, an empty diff and empty machine evidence - the same defect
          # as C14's, one cell over (CCV1-147B).
          python control-plane/c13-c14-lite/lite_cli.py spec --role c13 \
            --scope "$RUNNER_TEMP/scope.json" \
            --candidate-diff "$RUNNER_TEMP/candidate.diff" \
            --review-brief "$RUNNER_TEMP/review_brief.json" \
            --machine-manifest "$RUNNER_TEMP/manifest.json" \
            --junit "$RUNNER_TEMP/junit.xml" \
            --spec "$RUNNER_TEMP/c13.spec.json" \
            --facts "$RUNNER_TEMP/c13.facts.json" \
            --contract "$RUNNER_TEMP/c13.contract.json"

      - name: Run one fresh AI quality review (does not execute the candidate)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python control-plane/c13-c14-lite/lite_cli.py review \
            --spec "$RUNNER_TEMP/c13.spec.json" \
            --facts "$RUNNER_TEMP/c13.facts.json" \
            --out "$RUNNER_TEMP/c13.outcome.json" \
            --allow-blocked

      - name: Seal the C13 bundle behind the C14 prerequisite gate
        run: |
          set -euo pipefail
          python control-plane/c13-c14-lite/lite_cli.py seal \
            --spec "$RUNNER_TEMP/c13.spec.json" \
            --contract "$RUNNER_TEMP/c13.contract.json" \
            --outcome "$RUNNER_TEMP/c13.outcome.json" \
            --facts "$RUNNER_TEMP/c13.facts.json" \
            --prereq "$RUNNER_TEMP/c14_bundle.json" \
            --junit "$RUNNER_TEMP/junit.xml" \
            --stdout "$RUNNER_TEMP/stdout.txt" \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --out "$RUNNER_TEMP/artifacts/c13_bundle.json"
          cp "$RUNNER_TEMP/c13.outcome.json" "$RUNNER_TEMP/artifacts/c13_opinion.json"

      - name: Preserve C13 raw review evidence after success or failure
        if: always()
        run: |
          set -euo pipefail
          python control-plane/c13-c14-lite/lite_cli.py raw-evidence \
            --out "$RUNNER_TEMP/c13-raw" \
            --spec "$RUNNER_TEMP/c13.spec.json" \
            --facts "$RUNNER_TEMP/c13.facts.json" \
            --contract "$RUNNER_TEMP/c13.contract.json" \
            --outcome "$RUNNER_TEMP/c13.outcome.json" \
            --scope "$RUNNER_TEMP/scope.json" \
            --review-brief "$RUNNER_TEMP/review_brief.json"

      - name: Preserve allowlisted failure diagnostics even when raw publication refuses
        if: always()
        run: |
          python control-plane/c13-c14-lite/lite_failure_diagnostic.py \
            --spec "$RUNNER_TEMP/c13.spec.json" \
            --outcome "$RUNNER_TEMP/c13.outcome.json" \
            --out "$RUNNER_TEMP/c13-diagnostic/failure_diagnostic.json"

      - name: Publish diagnostic metadata (not acceptance evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c13c14-lite-c13-diagnostic-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/c13-diagnostic
          if-no-files-found: warn
          retention-days: 90

      - name: Publish C13 raw review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c13c14-lite-c13-raw-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/c13-raw
          if-no-files-found: warn
          retention-days: 90

      - name: Verify the whole round from the received bytes
        if: always()
        run: |
          set -euo pipefail
          python control-plane/c13-c14-lite/lite_cli.py verify \
            --spec "$RUNNER_TEMP/c13.spec.json" \
            --c14-bundle "$RUNNER_TEMP/c14_bundle.json" \
            --c13-bundle "$RUNNER_TEMP/artifacts/c13_bundle.json" \
            --c14-contract "$RUNNER_TEMP/c14.contract.json" \
            --c13-contract "$RUNNER_TEMP/c13.contract.json" \
            --c14-opinion "c14-input/c14_opinion.json" \
            --c13-opinion "$RUNNER_TEMP/artifacts/c13_opinion.json" \
            --junit "$RUNNER_TEMP/junit.xml" \
            --stdout "$RUNNER_TEMP/stdout.txt" \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --out "$RUNNER_TEMP/artifacts/round_decision.json" \
            --allow-incomplete

      - name: Publish the sealed C13 bundle and the round decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c13c14-lite-c13-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: error
          retention-days: 90

      - name: Read back run and artifact identity through the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python control-plane/c13-c14-lite/lite_readback.py \
            --role c13 \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --expected-head-sha "${GITHUB_SHA}" \
            --workflow-path "$LITE_WORKFLOW_IDENTITY" \
            --run-id "${GITHUB_RUN_ID}" \
            --out "$RUNNER_TEMP/artifacts/readback.json"

      - name: Publish the run/artifact readback record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c13c14-lite-c13-readback-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/artifacts/readback.json
          if-no-files-found: warn
          retention-days: 90
