name: C03 PostgreSQL candidate-bound evidence

on:
  workflow_dispatch:
  push:
    branches:
      - ops/c01-formal-20260915
    paths:
      - .github/workflows/c01-c14-deterministic.yml

permissions:
  contents: read

env:
  TASK_ID: V70-R3-C03-01
  CANDIDATE_SHA: dcb68a652429aa01e8428ce9f582e4bab6a6175e
  APPLICATION_TREE: dd815baf0105cce603e9a28b002cfb9d8b95d186
  DATABASE_URL: postgresql+psycopg://go:go@localhost:5432/go_hotel
  EVIDENCE_DIR: c03-postgresql-evidence

jobs:
  postgresql-race-tests:
    name: C03 PG rail payment inventory races
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: go
          POSTGRES_PASSWORD: go
          POSTGRES_DB: go_hotel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U go -d go_hotel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD:application)" = "$APPLICATION_TREE"

      - name: Install inherited frozen Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python ci/retention/dependencies.py --repository . --output "$RUNNER_TEMP/frozen"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/frozen/wheelhouse" -r ci/retention/requirements.lock

      - name: Prepare explicit PostgreSQL test harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cp application/tests/conftest.py "$RUNNER_TEMP/conftest.original.py"
          python - <<'PY'
          from pathlib import Path
          p=Path("application/tests/conftest.py")
          old='os.environ["DATABASE_URL"] = f"sqlite+pysqlite:///{DB}"'
          new='os.environ.setdefault("DATABASE_URL", f"sqlite+pysqlite:///{DB}")'
          text=p.read_text()
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          PY
          git diff -- application/tests/conftest.py > "$EVIDENCE_DIR/PG_HARNESS.patch"
          sha256sum "$RUNNER_TEMP/conftest.original.py" application/tests/conftest.py "$EVIDENCE_DIR/PG_HARNESS.patch" > "$EVIDENCE_DIR/PG_HARNESS.sha256"
          pg_isready -h localhost -p 5432 -U go -d go_hotel

      - name: Execute task-bound PostgreSQL race and convergence tests
        id: pgtests
        shell: bash
        run: |
          set +e
          RAW="$EVIDENCE_DIR/TEST_RUN.raw.log"
          {
            echo "TASK_ID=$TASK_ID"
            echo "STARTED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "RUNNER_OS=$RUNNER_OS"
            echo "PYTHON_VERSION=$(python --version 2>&1)"
            echo "COMMAND=git rev-parse HEAD"
            git rev-parse HEAD
            echo "COMMAND=git rev-parse HEAD:application"
            git rev-parse HEAD:application
            echo "COMMAND=psql server_version"
            PGPASSWORD=go psql -h localhost -U go -d go_hotel -Atc "show server_version;"
            echo "DATABASE_BACKEND=postgresql+psycopg"
            echo "COMMAND=cd application && DATABASE_URL=postgresql+psycopg://go:REDACTED@localhost:5432/go_hotel python -m pytest -p no:cacheprovider tests/test_next_depth_c03_payment_inventory_races.py -vv"
          } > "$RAW" 2>&1
          (
            cd application
            DATABASE_URL="$DATABASE_URL" python -m pytest -p no:cacheprovider tests/test_next_depth_c03_payment_inventory_races.py -vv
          ) >> "$RAW" 2>&1
          TEST_EXIT=$?
          {
            echo "EXIT_CODE=$TEST_EXIT"
            echo "FINISHED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$RAW"
          sha256sum "$RAW" > "$EVIDENCE_DIR/TEST_RUN.raw.log.sha256"
          printf '%s\n' "$TEST_EXIT" > "$EVIDENCE_DIR/TEST_EXIT_CODE.txt"
          exit "$TEST_EXIT"

      - name: Bind immutable evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "task_id=$TASK_ID"
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "application_tree=$(git rev-parse HEAD:application)"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_job=${{ github.job }}"
            echo "workflow_attempt=${{ github.run_attempt }}"
            echo "postgres_image=postgres:18.4"
            echo "test_file=application/tests/test_next_depth_c03_payment_inventory_races.py"
            echo "product_source_changed=false"
            echo "final_release=HOLD"
            echo "hk_deploy=HOLD"
            echo "production=HOLD"
          } > "$EVIDENCE_DIR/BINDING.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD:application)" = "$APPLICATION_TREE"
          find "$EVIDENCE_DIR" -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/SHA256SUMS.txt"
          cat "$EVIDENCE_DIR/TEST_RUN.raw.log.sha256" || true
          cat "$EVIDENCE_DIR/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c03-${{ env.TASK_ID }}-${{ env.CANDIDATE_SHA }}-postgresql
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
