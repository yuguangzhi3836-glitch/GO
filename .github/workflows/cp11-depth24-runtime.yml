name: CP11 DEPTH25 isolated runtime acceptance
on:
  push:
    branches: [acceptance/cp11-depth25-runtime]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cp11-depth25-runtime
  cancel-in-progress: false
jobs:
  isolated-runtime:
    if: startsWith(github.ref, 'refs/heads/acceptance/cp11-depth25-runtime')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: go
          POSTGRES_PASSWORD: go-disposable-ci-only
          POSTGRES_DB: go
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U go" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://go@localhost:5432/go
      PGPASSWORD: go-disposable-ci-only
      REDIS_URL: redis://localhost:6379/0
      DEPTH24_DELTA_PATH: deliverables/CP11_DEPTH24_RUNTIME_CANDIDATE_20260909/GO_CP11_DEPTH_24_UNPAID_EXPIRY_DELTA_20260909.zip
      DEPTH24_DELTA_SHA256: ee71bc8257f75dee49aa77f33816cfb4d07fd45af1fba85e51b4faf6a7f0b03c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Verify and materialize immutable source and dependencies
        run: python ci/materialize_depth24.py
      - name: Verify and apply the reviewed DEPTH25 migration delta
        run: python ci/apply_depth25_overlay.py
      - name: Install frozen offline dependencies
        run: python -m pip install --no-index --find-links dependencies/wheelhouse -r source/gate_runtime/requirements.lock
      - name: Apply complete PostgreSQL migration chain
        working-directory: source
        env:
          DATABASE_URL: postgresql+psycopg://go@localhost:5432/go
          PYTHONPATH: src
        run: python -m alembic upgrade head
      - name: Migration history regression
        working-directory: source
        run: python -m pytest tests/test_depth25_migration_history.py tests/test_parent_implementation_code_review_debt_closure.py::test_current_source_head_and_upgrade_downgrade_roundtrip --junitxml=../evidence/migration_history.xml
      - name: Original six PostgreSQL concurrency cases
        working-directory: source
        run: python -m pytest tests/test_p0_0100_postgres_concurrency.py tests/test_p0_0101_postgres_race_matrix.py --junitxml=../evidence/postgres_existing.xml
      - name: Native expiry and process recovery with PostgreSQL
        working-directory: source
        env:
          DATABASE_URL: postgresql+psycopg://go@localhost:5432/go
          PYTHONPATH: src
        run: python -m pytest ../ci/gate_tests --junitxml=../evidence/postgres_expiry.xml
      - name: Actual Redis queue adapter
        working-directory: source
        env:
          PYTHONPATH: src
        run: python scripts/queue_smoke.py > ../evidence/redis_queue.txt
      - name: Frozen Node frontend logic and syntax
        working-directory: source
        run: |
          node --test --test-reporter=junit tests_frontend/*.test.mjs > ../evidence/frontend_node22.xml
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          files=list(Path('frontend').rglob('*.js'))
          assert len(files)==44
          for path in files:subprocess.run(['node','--check',str(path)],check=True)
          Path('../evidence/frontend_syntax.json').write_text(json.dumps({'passed':len(files),'node':subprocess.check_output(['node','--version'],text=True).strip()}))
          PY
      - name: Record fail-closed runtime gate
        if: always()
        env:
          PRIOR_STEPS_STATUS: ${{ job.status }}
        run: python ci/finish_gate.py
      - name: Archive original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GO-CP11-DEPTH25-runtime-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 90
