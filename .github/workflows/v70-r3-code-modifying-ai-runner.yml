name: V7 R3 11-Cell code-modifying AI orchestration

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v70-r3-code-modifying-ai-runner.yml
      - .github/workflows/v70-r3-ai-cell-pipeline.yml
      - automation/coding-runner/TASKS.json

permissions:
  contents: write
  pull-requests: write

jobs:
  credential-preflight:
    name: OpenAI coding credential preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require OPENAI_API_KEY for real Codex execution
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'BLOCKED_OPENAI_API_KEY_MISSING: configure repository Actions secret OPENAI_API_KEY; no Cell runner will start.' >&2
            exit 78
          fi
          echo 'OPENAI_API_KEY_PRESENT=true'

  c01:
    needs: credential-preflight
    uses: ./.github/workflows/v70-r3-ai-cell-pipeline.yml
    with: {cell: C01, task: V70-R3-C01-01, issue: '79', model: gpt-5.6-sol, effort: high, baseline_test: tests/test_v70_next_c01_unknown_funding.py, scope: application, base_sha: '${{ github.event.pull_request.base.sha }}', runner_head_sha: '${{ github.event.pull_request.head.sha }}', expected_application_tree: dd815baf0105cce603e9a28b002cfb9d8b95d186, r3_product_anchor: 8ffcde66d36c1bbf849218529ef015f6e81725af}
    secrets: inherit
  c02:
    needs: credential-preflight
    uses: ./.github/workflows/v70-r3-ai-cell-pipeline.yml
    with: {cell: C02, task: V70-R3-C02-01, issue: '80', model: gpt-5.6-sol, effort: high, baseline_test: tests/test_v70_next_c02_coupon_plan.py, scope: application, base_sha: '${{ github.event.pull_request.base.sha }}', runner_head_sha: '${{ github.event.pull_request.head.sha }}', expected_application_tree: dd815baf0105cce603e9a28b002cfb9d8b95d186, r3_product_anchor: 8ffcde66d36c1bbf849218529ef015f6e81725af}
