name: V7 R3 code-modifying AI runner

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v70-r3-code-modifying-ai-runner.yml
      - automation/coding-runner/TASKS.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: v70-r3-code-modifying-${{ github.event.pull_request.number }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  code-modifying-cell:
    name: code-${{ matrix.cell }}-${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        include:
          - {cell: C01, task: V70-R3-C01-01, issue: '79', model: gpt-5.6-sol, effort: high, baseline_test: tests/test_v70_next_c01_unknown_funding.py, scope: application}
          - {cell: C02, task: V70-R3-C02-01, issue: '80', model: gpt-5.6-sol, effort: high, baseline_test: tests/test_v70_next_c02_coupon_plan.py, scope: application}
          - {cell: C03, task: V70-R3-C03-01, issue: '81', model: gpt-6-astra, effort: high, baseline_test: tests/test_next_depth_c03_payment_inventory_races.py, scope: application}
          - {cell: C04, task: V70-R3-C04-01, issue: '82', model: gpt-5.6-sol, effort: high, baseline_test: tests/test_v70_next_c04_readonly_reconciliation.py, scope: application}
          - {cell: C05, task: V70-R3-C05-01, issue: '83', model: gpt-5.6-sol, effort: high, baseline_test: tests/test_v70_next_c05_recovery_evidence.py, scope: application}
          - {cell: C07, task: V70-R3-C07-01, issue: '95', model: gpt-5.6-sol, effort: high, baseline_test: tests/test_round2_c07_explicit_preferences.py, scope: application}
          - {cell: C08, task: V70-R3-C08-01, issue: '84', model: gpt-6-astra, effort: high, baseline_test: tests/go_ai/test_c08_hard_exit_recovery.py, scope: application}
          - {cell: C09, task: V70-R3-C09-01, issue: '85', model: gpt-6-astra, effort: high, baseline_test: tests/judgment/test_next_depth_concurrent_judgment.py, scope: application}
          - {cell: C10, task: V70-R3-C10-01, issue: '86', model: gpt-5.6-sol, effort: high, baseline_test: tests/journey/test_c10_batch_list_projection.py, scope: application}
          - {cell: C11, task: V70-R3-C11-01, issue: '87', model: gpt-6-astra, effort: high, baseline_test: tests/payments/test_c11_flight_idempotency_recovery.py, scope: application}
          - {cell: C12, task: V70-R3-C12-01, issue: '88', model: gpt-6-astra, effort: high, baseline_test: ci/round2/test_validate_ledger.py, scope: scheduler}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: go_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d go_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      EXPECTED_APPLICATION_TREE: dd815baf0105cce603e9a28b002cfb9d8b95d186
      R3_PRODUCT_ANCHOR: 8ffcde66d36c1bbf849218529ef015f6e81725af
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/go_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/go_test
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONPATH: application/src:application
      CELL: ${{ matrix.cell }}
      TASK_ID: ${{ matrix.task }}
      ISSUE_NUMBER: ${{ matrix.issue }}
      BASELINE_TEST: ${{ matrix.baseline_test }}
      EDIT_SCOPE: ${{ matrix.scope }}

    steps:
      - name: Checkout current canonical main snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and emit task ACK
        shell: bash
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse HEAD)
          app_tree=$(git rev-parse HEAD:application)
          test "$app_tree" = "$EXPECTED_APPLICATION_TREE"
          mkdir -p "$RUNNER_TEMP/ai-candidate"
          BASE_SHA="$base_sha" APP_TREE="$app_tree" python - <<'PY'
          import hashlib, json, os, pathlib, datetime
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ai-candidate'
          ack = {
            'schema': 'go.v70.r3.ai-runner.ack.v1',
            'cell_id': os.environ['CELL'],
            'task_id': os.environ['TASK_ID'],
            'issue_number': int(os.environ['ISSUE_NUMBER']),
            'repository_base_sha': os.environ['BASE_SHA'],
            'r3_product_anchor': os.environ['R3_PRODUCT_ANCHOR'],
            'application_tree_before': os.environ['APP_TREE'],
            'run_id': os.environ['GITHUB_RUN_ID'],
            'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
            'status': 'ACK_STARTED',
            'acknowledged_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'final_release': 'HOLD',
            'hk_deploy': 'HOLD',
            'production': 'HOLD'
          }
          raw=(json.dumps(ack,indent=2)+'\n').encode()
          (out/'ACK.json').write_bytes(raw)
          (out/'ACK.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  ACK.json\n')
          PY
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "APPLICATION_TREE_BEFORE=$app_tree" >> "$GITHUB_ENV"

      - name: Verify OpenAI coding credential is present
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'BLOCKED_OPENAI_API_KEY_MISSING: repository secret OPENAI_API_KEY is required for the real coding runner.' >&2
            exit 78
          fi

      - name: Set up Python and application dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e 'application[dev]'

      - name: Build trusted task prompt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          task=json.loads(pathlib.Path('automation/coding-runner/TASKS.json').read_text())['cells'][os.environ['CELL']]
          rules=json.loads(pathlib.Path('automation/coding-runner/TASKS.json').read_text())['global_rules']
          if os.environ['EDIT_SCOPE']=='application':
              allowed='You may modify only application/src/** and application/tests/**. Do not modify application/alembic/**.'
              required='You MUST leave at least one real implementation change under application/src/ and at least one regression-test change under application/tests/.'
              test_note=f"Preserve and run the inherited baseline: cd application && python -m pytest -q {os.environ['BASELINE_TEST']}"
          else:
              allowed='C12 may modify only ci/round2/validate_ledger.py, ci/round2/verify_execution_receipt.py, and ci/round2/test_*.py. Do not modify command-center, control-plane, hk-staging, deploy, secrets, signing material, workflows or application business source.'
              required='You MUST leave at least one real implementation change in ci/round2/validate_ledger.py or ci/round2/verify_execution_receipt.py and at least one regression-test change under ci/round2/test_*.py.'
              test_note=f"Preserve and run the inherited baseline: python -m pytest -q {os.environ['BASELINE_TEST']}"
          prompt=f'''GO V7.0 / V6.1 lineage + C14 controlled coding task.\n\nCell: {os.environ['CELL']}\nTask: {os.environ['TASK_ID']}\nIssue: #{os.environ['ISSUE_NUMBER']}\nRepository base SHA: {os.environ['BASE_SHA']}\nR3 product anchor: {os.environ['R3_PRODUCT_ANCHOR']}\nExpected starting application tree: {os.environ['APPLICATION_TREE_BEFORE']}\n\nOBJECTIVE\n{task['objective']}\n\nHARD SCOPE\n{allowed}\n{required}\n\nRULES\n- '''+'\n- '.join(rules)+f'''\n\nENGINEERING METHOD\n1. Inspect the current implementation and inherited tests first. Do not rewrite already-PASS behavior simply to create a diff.\n2. Identify one concrete, executable depth gap within this Cell.\n3. Add a regression test that demonstrates the gap and implement the smallest safe fix.\n4. {test_note}\n5. Run focused tests you add or change.\n6. Leave the actual code/test edits in the working tree.\n7. Do NOT commit, push, open/merge PRs, modify GitHub state, deploy, or alter external systems.\n\nFINAL RESPONSE\nState the gap found, files changed, tests actually run/results, and remaining scoped risk. Never claim C14, C13, FINAL_RELEASE, HK_DEPLOY or PRODUCTION PASS.''' 
          pathlib.Path(os.environ['RUNNER_TEMP'],'ai-candidate','PROMPT.md').write_text(prompt)
          PY

      - name: Run real code-modifying Codex agent
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          model: ${{ matrix.model }}
          effort: ${{ matrix.effort }}
          prompt-file: ${{ runner.temp }}/ai-candidate/PROMPT.md
          output-file: ${{ runner.temp }}/ai-candidate/CODEX_FINAL.txt

      - name: Deterministic post-agent diff gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai-candidate"
          { git diff --name-only "$BASE_SHA"; git ls-files --others --exclude-standard; } | sed '/^$/d' | sort -u > "$RUNNER_TEMP/ai-candidate/CHANGED_FILES.txt"
          echo 'AI changed files:'
          cat "$RUNNER_TEMP/ai-candidate/CHANGED_FILES.txt"
          test -s "$RUNNER_TEMP/ai-candidate/CHANGED_FILES.txt"
          python - <<'PY'
          import os, pathlib, sys
          paths=[p.strip() for p in (pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-candidate'/'CHANGED_FILES.txt').read_text().splitlines() if p.strip()]
          if os.environ['EDIT_SCOPE']=='application':
              bad=[p for p in paths if not (p.startswith('application/src/') or p.startswith('application/tests/'))]
              has_impl=any(p.startswith('application/src/') for p in paths)
              has_test=any(p.startswith('application/tests/') for p in paths)
          else:
              allowed_exact={'ci/round2/validate_ledger.py','ci/round2/verify_execution_receipt.py'}
              bad=[p for p in paths if not (p in allowed_exact or (p.startswith('ci/round2/test_') and p.endswith('.py')))]
              has_impl=any(p in allowed_exact for p in paths)
              has_test=any(p.startswith('ci/round2/test_') and p.endswith('.py') for p in paths)
          if bad:
              print('OUT_OF_SCOPE_CHANGED_FILES='+','.join(bad),file=sys.stderr); raise SystemExit(31)
          if not has_impl:
              print('NO_REAL_IMPLEMENTATION_DIFF',file=sys.stderr); raise SystemExit(32)
          if not has_test:
              print('NO_REGRESSION_TEST_DIFF',file=sys.stderr); raise SystemExit(33)
          PY

      - name: Execute baseline and changed regression tests
        shell: bash
        run: |
          set -euo pipefail
          changed_tests=$(grep -E '(^application/tests/.*\.py$|^ci/round2/test_.*\.py$)' "$RUNNER_TEMP/ai-candidate/CHANGED_FILES.txt" || true)
          : > "$RUNNER_TEMP/ai-candidate/TESTS.log"
          if [ "$EDIT_SCOPE" = application ]; then
            pushd application >/dev/null
            args=("$BASELINE_TEST")
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              rel=${p#application/}
              if [ "$rel" != "$BASELINE_TEST" ]; then args+=("$rel"); fi
            done <<< "$changed_tests"
            python -m pytest -q "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/ai-candidate/TESTS.log"
            popd >/dev/null
          else
            args=("$BASELINE_TEST")
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              if [ "$p" != "$BASELINE_TEST" ]; then args+=("$p"); fi
            done <<< "$changed_tests"
            python -m pytest -q "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/ai-candidate/TESTS.log"
          fi

      - name: Create candidate commit without hooks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GO AI Candidate Runner'
          git config user.email 'go-ai-candidate@users.noreply.github.com'
          mapfile -t files < "$RUNNER_TEMP/ai-candidate/CHANGED_FILES.txt"
          git -c core.hooksPath=/dev/null add -- "${files[@]}"
          git -c core.hooksPath=/dev/null diff --cached --check
          git -c core.hooksPath=/dev/null commit -m "${TASK_ID}: AI depth candidate for ${CELL}"
          candidate_sha=$(git rev-parse HEAD)
          app_tree=$(git rev-parse HEAD:application)
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          echo "APPLICATION_TREE_AFTER=$app_tree" >> "$GITHUB_ENV"

      - name: Generate immutable candidate manifest and raw Evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, datetime
          root=pathlib.Path.cwd(); out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-candidate'
          changed=[p for p in (out/'CHANGED_FILES.txt').read_text().splitlines() if p]
          tracked=subprocess.check_output(['git','ls-files','-z','application']).decode().split('\0')
          items=[]
          for p in sorted(x for x in tracked if x):
              items.append((p[len('application/'):], hashlib.sha256((root/p).read_bytes()).hexdigest()))
          source_fp=hashlib.sha256(''.join(f'{p}\0{h}\n' for p,h in items).encode()).hexdigest()
          tests_sha=hashlib.sha256((out/'TESTS.log').read_bytes()).hexdigest()
          ack_sha=hashlib.sha256((out/'ACK.json').read_bytes()).hexdigest()
          final_path=out/'CODEX_FINAL.txt'
          final_sha=hashlib.sha256(final_path.read_bytes()).hexdigest() if final_path.exists() else None
          manifest={
            'schema':'go.v70.r3.ai-fixed-candidate.v1',
            'cell_id':os.environ['CELL'],'task_id':os.environ['TASK_ID'],'issue_number':int(os.environ['ISSUE_NUMBER']),
            'repository_base_sha':os.environ['BASE_SHA'],'r3_product_anchor':os.environ['R3_PRODUCT_ANCHOR'],
            'candidate_sha':os.environ['CANDIDATE_SHA'],'application_tree_before':os.environ['APPLICATION_TREE_BEFORE'],
            'application_tree_after':os.environ['APPLICATION_TREE_AFTER'],'application_source_fingerprint_sha256':source_fp,
            'changed_files':changed,'task_bound_ack_sha256':ack_sha,'raw_test_log_sha256':tests_sha,
            'codex_final_message_sha256':final_sha,'model':'${{ matrix.model }}','reasoning_effort':'${{ matrix.effort }}',
            'candidate_status':'FIXED_CANDIDATE_READY_FOR_C14','c14':'REQUIRED','c13':'HOLD_UNTIL_C14_PASS',
            'final_release':'HOLD','hk_deploy':'HOLD','production':'HOLD',
            'created_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          raw=(json.dumps(manifest,indent=2)+'\n').encode(); (out/'EVIDENCE.json').write_bytes(raw)
          (out/'EVIDENCE.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  EVIDENCE.json\n')
          (out/'SOURCE_FINGERPRINT.sha256').write_text(source_fp+'  application\n')
          PY

      - name: Push isolated candidate branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="candidate/r3-${CELL,,}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CANDIDATE_BRANCH=$branch" >> "$GITHUB_ENV"
          git branch -f "$branch" "$CANDIDATE_SHA"
          git -c core.hooksPath=/dev/null -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" push origin "refs/heads/$branch:refs/heads/$branch"

      - name: Open Draft candidate PR for C14
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_sha=$(awk '{print $1}' "$RUNNER_TEMP/ai-candidate/EVIDENCE.sha256")
          body=$(cat <<EOF
          Automated code-modifying candidate for **${CELL} / ${TASK_ID}**.

          This PR is a fixed-candidate handoff only. The AI agent did not commit, push, merge or deploy; deterministic post-agent steps validated scope/tests, created the candidate commit and pushed this branch.

          - base SHA: ${BASE_SHA}
          - R3 product anchor: ${R3_PRODUCT_ANCHOR}
          - candidate SHA: ${CANDIDATE_SHA}
          - application tree before: ${APPLICATION_TREE_BEFORE}
          - application tree after: ${APPLICATION_TREE_AFTER}
          - Evidence SHA256: ${evidence_sha}
          - C14: REQUIRED
          - C13: HOLD until independent C14 PASS
          - FINAL_RELEASE: HOLD
          - HK_DEPLOY: HOLD
          - PRODUCTION: HOLD

          Candidate Evidence is also uploaded as the workflow artifact for run ${GITHUB_RUN_ID}.
          EOF
          )
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$CANDIDATE_BRANCH" --draft --title "${TASK_ID}: ${CELL} AI fixed candidate — C14 required" --body "$body"

      - name: Upload immutable candidate Evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixed-candidate-${{ matrix.cell }}-${{ matrix.task }}
          path: ${{ runner.temp }}/ai-candidate
          if-no-files-found: error
          retention-days: 90
