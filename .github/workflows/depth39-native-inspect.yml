name: depth39-native-lifecycle-inspect
on:
  pull_request:
    branches: [p0-agent-transaction-lifecycle-v0-2]
    paths:
      - '.github/workflows/depth39-native-inspect.yml'
      - 'ci/depth39/**'
      - 'src/go_hotel/**'
      - 'mobile/go-app/native/apple/**'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout P0.3
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Checkout verified DEPTH36 restore tooling
        uses: actions/checkout@v4
        with:
          ref: ff13ca334acfcec61d6463f30ca94d7964086635
          path: depth36-tooling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Restore sealed native source
        shell: bash
        run: |
          python depth36-tooling/ci/depth36/materialize_parent.py --depth26 candidate/deliverables/CP11_DEPTH26_20260909 --depth27 candidate/deliverables/CP11_DEPTH27_20260909 --depth28 candidate/deliverables/CP11_DEPTH28_V14_INTEGRATION_20260909 --output restored-parent >/dev/null
          python candidate/deliverables/CP11_DEPTH29_TRIP_REENTRY_20260909/restore_depth29.py --parent restored-parent --output restored29 >/dev/null
          python candidate/deliverables/CP11_DEPTH30_NATIVE_PAYMENT_20260909/restore_depth30.py --parent restored29 --output restored30 >/dev/null
          python candidate/deliverables/CP11_DEPTH31_CONSENT_DIRECT_20260910/restore_delta.py --parent restored30 --package candidate/deliverables/CP11_DEPTH31_CONSENT_DIRECT_20260910 --output restored31 >/dev/null
          python candidate/deliverables/CP11_DEPTH32R2_CHANGE_TERMS_REFUND_20260910/restore_delta.py --parent restored31 --package candidate/deliverables/CP11_DEPTH32R2_CHANGE_TERMS_REFUND_20260910 --output restored32 >/dev/null
          python candidate/deliverables/CP11_DEPTH33_MOBILITY_REFUND_20260910/restore_delta.py --parent restored32 --package candidate/deliverables/CP11_DEPTH33_MOBILITY_REFUND_20260910 --output restored33 >/dev/null
          python candidate/deliverables/CP11_DEPTH34R2_HOTEL_QUOTE_IDENTITY_20260910/restore_delta.py --parent restored33 --package candidate/deliverables/CP11_DEPTH34R2_HOTEL_QUOTE_IDENTITY_20260910 --output restored34 >/dev/null
          python candidate/deliverables/CP11_DEPTH35R2_SESSION_TRANSITIONS_20260910/restore_delta.py --parent restored34 --package candidate/deliverables/CP11_DEPTH35R2_SESSION_TRANSITIONS_20260910 --output restored35 >/dev/null
          python candidate/deliverables/CP11_DEPTH36_ISOLATED_RUNTIME_20260910/restore_delta.py --parent restored35 --package candidate/deliverables/CP11_DEPTH36_ISOLATED_RUNTIME_20260910 --output restored >/dev/null
      - name: Inspect exact native contracts
        shell: bash
        run: |
          echo '=== HOTEL connector base ==='
          sed -n '1,220p' restored/src/go_hotel/connectors/base.py
          echo '=== HOTEL mock connector ==='
          sed -n '1,180p' restored/src/go_hotel/connectors/mock_hotel.py
          echo '=== HOTEL registry ==='
          sed -n '1,220p' restored/src/go_hotel/connectors/registry.py
          echo '=== HOTEL booking service ==='
          sed -n '1,180p' restored/src/go_hotel/services/booking.py
          echo '=== RIDE model ==='
          sed -n '1440,1478p' restored/src/go_hotel/db/models.py
          echo '=== RENTAL model ==='
          sed -n '1460,1495p' restored/src/go_hotel/db/models.py
          echo '=== RIDE service ==='
          sed -n '1,180p' restored/src/go_hotel/mobility/ride/service.py
          echo '=== RENTAL service ==='
          sed -n '1,235p' restored/src/go_hotel/mobility/rental/service.py
          echo '=== VERTICAL expiry ==='
          sed -n '1,175p' restored/src/go_hotel/services/vertical_reservation_expiry.py
          echo '=== PAYMENT bridge ==='
          sed -n '1,150p' restored/src/go_hotel/services/vertical_transaction_bridge.py
          echo '=== APPLE files/project/workflows ==='
          find candidate restored -maxdepth 8 \( -name '*.xcodeproj' -o -name '*.xcworkspace' -o -name 'Package.swift' -o -name '*.swift' \) -print | sort
          grep -R -n -E 'runs-on:.*macos|runs-on:.*self-hosted|xcodebuild|iphoneos|iphonesimulator|CODE_SIGN|DEVELOPMENT_TEAM|AppIntents' candidate/.github candidate/mobile 2>/dev/null || true
