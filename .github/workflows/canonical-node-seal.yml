name: Canonical Node seal overlay and independent restore
on:
  pull_request:
    branches: [main]
    paths:
      - packaging/canonical-node-seal/**
      - .github/workflows/canonical-node-seal.yml
permissions:
  contents: read
concurrency:
  group: canonical-node-seal-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Archive safety
        run: python3 -B -m unittest discover -s packaging/canonical-node-seal -p 'test_*.py' -v
      - name: Provision official pinned Node overlay and run existing gate
        run: |
          set -o pipefail
          python3 -B packaging/canonical-node-seal/seal.py build "$RUNNER_TEMP/node-delivery" 2>&1 | tee "$RUNNER_TEMP/node-build.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-node-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/node-delivery/node-seal.tar.gz
            ${{ runner.temp }}/node-delivery/node-seal.sha256
            ${{ runner.temp }}/node-delivery/bundle/*.json
            ${{ runner.temp }}/node-delivery/bundle/*.log
            ${{ runner.temp }}/node-build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  independent-restore:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: canonical-node-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/downloaded
      - name: Restore retained overlay and rerun gate without provisioning
        run: |
          set -o pipefail
          python3 -B packaging/canonical-node-seal/seal.py restore "$RUNNER_TEMP/downloaded/node-delivery" 2>&1 | tee "$RUNNER_TEMP/node-restore.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-node-restore-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/downloaded/node-delivery/restore-evidence
            ${{ runner.temp }}/node-restore.log
          if-no-files-found: error
          retention-days: 90
