name: Payment Draft Truth Regression
on:
  push:
    branches: [payment-depth-command-center-20260919]
    paths:
      - application/src/go_hotel/services/omnichannel_payment.py
      - application/src/go_hotel/services/real_external_execution.py
      - application/src/go_hotel/services/unified_money_movement.py
      - application/tests/test_omnichannel_payment_finance_os.py
      - application/tests/test_p0_0100_real_external_execution.py
      - application/tests/test_unified_money_movement_finance_close.py
      - .github/workflows/payment-draft-truth-regression.yml
  workflow_dispatch:
permissions:
  contents: read
# One superseding run per Draft branch: a new candidate cancels stale work.
concurrency:
  group: payment-draft-truth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  payment-draft-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: application
    env:
      LIVE_MONEY: LOCKED
      GO_EXTERNAL_SANDBOX_NETWORK_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q src/go_hotel/services/omnichannel_payment.py src/go_hotel/services/real_external_execution.py src/go_hotel/services/unified_money_movement.py
      - run: pytest -q --junitxml=payment-draft-truth.junit.xml tests/test_omnichannel_payment_finance_os.py tests/test_p0_0100_real_external_execution.py tests/test_unified_money_movement_finance_close.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-draft-truth-${{ github.sha }}
          path: application/payment-draft-truth.junit.xml
          if-no-files-found: error
          retention-days: 7
# Draft-only regression; no PSP, credentials, network, deployment, or money movement.
