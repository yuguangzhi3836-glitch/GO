name: Application CPU candidate budget
on:
  pull_request:
    paths:
      - 'ci/cpu_candidate.py'
      - 'ci/cpu_candidate.json'
      - 'application/src/**'
      - 'application/pyproject.toml'
      - 'application/alembic/**'
      - 'ci/test_cpu_candidate.py'
      - 'ci/journey_latency/**'
      - '.github/workflows/cpu-candidate.yml'
permissions:
  contents: read
concurrency:
  # Preserve the pinned four-round experiment when a follow-up repair is pushed.
  # Later unchanged experiment definitions still skip through the guard below.
  group: cpu-candidate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: go_ci
          POSTGRES_PASSWORD: isolated_multi_only
          POSTGRES_DB: go_c11_isolated
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U go_ci -d go_c11_isolated" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      GO_MULTI_DATABASE_URL: postgresql+psycopg://go_ci:isolated_multi_only@127.0.0.1:5432/go_c11_isolated
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an explicitly bound application candidate
        id: change
        run: |
          echo 'run=true' >> "$GITHUB_OUTPUT"
          if python3 -c 'import json, subprocess; config=json.load(open("ci/cpu_candidate.json")); tree=subprocess.check_output(["git","rev-parse","HEAD:application"],text=True).strip(); raise SystemExit(config.get("candidate_application_tree") != tree)'; then
            echo 'candidate=true' >> "$GITHUB_OUTPUT"
          else
            echo 'candidate=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.change.outputs.run == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
        if: steps.change.outputs.run == 'true'
      - run: python -m pip install -e './application[dev]'
        if: steps.change.outputs.run == 'true' && steps.change.outputs.candidate == 'true'
      - name: Validate candidate budget
        if: steps.change.outputs.run == 'true'
        run: python -m pytest ci/test_cpu_candidate.py ci/journey_latency/test_measure.py ci/journey_latency/test_verify.py -q
      - name: Transaction boundaries and money replay safety on isolated PostgreSQL
        if: steps.change.outputs.candidate == 'true'
        working-directory: application
        env:
          GO_TEST_DATABASE_URL: ${{ env.GO_MULTI_DATABASE_URL }}
          APP_ENV: test
          MODEL_GATEWAY_EXTERNAL_EGRESS_ENABLED: 'false'
          TRAVEL_INTELLIGENCE_ENABLED: 'false'
        run: |
          mkdir -p ../cpu-candidate-qualification
          python -m pytest tests/test_capacity_atomic_order.py tests/test_capacity_atomic_checkout.py tests/test_capacity_money_replay.py -q --junitxml=../cpu-candidate-qualification/payment.xml
          python -c "import xml.etree.ElementTree as E; s=E.parse('../cpu-candidate-qualification/payment.xml').getroot().find('testsuite'); assert int(s.get('tests')) >= 24; assert all(int(s.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))"
      - name: Baseline-candidate-candidate-baseline; identical harness, no profiler
        if: steps.change.outputs.run == 'true'
        run: python ci/cpu_candidate.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.change.outputs.run == 'true'
        with:
          name: cpu-candidate-${{ github.event.pull_request.head.sha }}
          path: |
            cpu-candidate-evidence/
            cpu-candidate-qualification/
          retention-days: 30
