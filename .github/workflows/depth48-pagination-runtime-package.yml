name: DEPTH48 pagination runtime package
on:
  pull_request:
    branches: [main]
    paths:
      - packaging/depth48-pagination-runtime/**
      - .github/workflows/depth48-pagination-runtime-package.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build fixed business image, isolated smoke, export and restore
        run: python3 -B packaging/depth48-pagination-runtime/build.py
      - name: Preserve package and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depth48-pagination-runtime-${{ github.event.pull_request.head.sha }}
          path: |
            GO_DEPTH48_ADMIN_PAGINATION_RUNTIME_20260913.zip
            RUNTIME_PACKAGE_RECEIPT.json
            runtime-package-evidence/MANIFEST.json
            runtime-package-evidence/image-smoke.log
          if-no-files-found: error
          retention-days: 90
