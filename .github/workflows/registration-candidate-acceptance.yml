name: Registration candidate acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - application/**
      - .github/workflows/registration-candidate-acceptance.yml
permissions:
  contents: read
jobs:
  registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: go_registration_ci
          POSTGRES_USER: go_ci
          POSTGRES_PASSWORD: isolated_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U go_ci -d go_registration_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://go_ci:isolated_ci_only@127.0.0.1:5432/go_registration_ci
      JWT_SIGNING_KEY: registration-ci-only-signing-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install application test dependencies
        run: python -m pip install -e './application[dev]'
      - name: Python and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q application/src
          node --check application/frontend/shared/app.js
          node --check application/frontend/shared/api.js
          node --check application/frontend/consumer/app.js
      - name: Targeted registration regressions
        working-directory: application
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          if [[ -f tests/test_supplier_onboarding_state.py ]]; then
            tests+=(tests/test_supplier_onboarding_state.py tests/test_sprint1u_production_bff.py)
          fi
          if [[ -f tests/test_consumer_registration_boundary.py ]]; then
            tests+=(tests/test_consumer_registration_boundary.py tests/test_sprint1y_consumer_identity.py)
          fi
          test ${#tests[@]} -gt 0
          python -m pytest "${tests[@]}"
      - name: PostgreSQL migration and legacy supplier compatibility
        if: ${{ hashFiles('application/alembic/versions/0135_supplier_onboarding.py') != '' }}
        working-directory: application
        shell: bash
        run: |
          set -euo pipefail
          alembic upgrade 0134_flight_status_width
          python - <<'PY'
          from go_hotel.security.service import identity_service
          identity_service.bootstrap()
          PY
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import select
          from go_hotel.core.config import settings
          from go_hotel.db.models import SupplierOnboardingRow
          from go_hotel.db.session import SessionLocal
          with SessionLocal() as s:
              row=s.scalar(select(SupplierOnboardingRow).where(SupplierOnboardingRow.supplier_id==settings.bootstrap_supplier_id))
              assert row is not None
              assert row.state == 'CONTRACT_ACTIVE'
          print('LEGACY_SUPPLIER_COMPATIBILITY=PASS')
          PY
