name: C01 durable UNKNOWN funding episode
on:
  push:
    branches:
      - cell/c01-v70-r4-unknown-funding-episode-20260916
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c01-unknown-episode:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: go
          POSTGRES_PASSWORD: go
          POSTGRES_DB: go_c01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U go -d go_c01_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://go:go@127.0.0.1:5432/go_c01_test
      EVIDENCE_DIR: evidence-ci/c01-r4-unknown-episode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/pyproject.toml
      - name: Install exact candidate
        run: python -m pip install -e './application[dev]'
      - name: Bind source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "task_id=V70-R4-C01-01"
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "application_tree=$(git rev-parse HEAD:application)"
            echo "source_fingerprint_method=sha256(git ls-tree -r --full-tree HEAD application)"
            printf "source_fingerprint_sha256="
            git ls-tree -r --full-tree HEAD application | sha256sum | awk '{print $1}'
            echo "base_product_candidate=9950bde1def11b27ed137d7db02a3047befda4fa"
            echo "branch_parent=e385562cbe107f5d4e2d072f811513c6aaf06e52"
          } | tee "$EVIDENCE_DIR/source_identity.txt"
      - name: Fresh PostgreSQL 18.4 migration round trip
        working-directory: application
        shell: bash
        run: |
          set -euo pipefail
          {
            python -m alembic heads
            test "$(python -m alembic heads | awk '{print $1}')" = "0137_hosted_money_unknown_episode"
            python -m alembic upgrade head
            python -m alembic current
            python -m alembic downgrade 0136_merge_go_ai_journey
            python -m alembic current
            python -m alembic upgrade head
            python -m alembic current
          } 2>&1 | tee "../$EVIDENCE_DIR/postgres-migration.log"
      - name: Run task-bound tests
        working-directory: application
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_v70_r4_c01_unknown_episode.py \
            --junitxml="../$EVIDENCE_DIR/task-bound.junit.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/task-bound.log"
      - name: Verify syntax and evidence digests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            application/src/go_hotel/services/hosted_money.py \
            application/src/go_hotel/api/routes/hosted_direct_booking.py \
            application/src/go_hotel/db/models.py \
            application/alembic/versions/0137_hosted_money_unknown_episode.py \
            application/tests/test_v70_r4_c01_unknown_episode.py
          find "$EVIDENCE_DIR" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum \
            | tee "$EVIDENCE_DIR/SHA256SUMS"
      - name: Upload candidate-bound Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c01-r4-unknown-episode
          path: evidence-ci/c01-r4-unknown-episode
          if-no-files-found: error
