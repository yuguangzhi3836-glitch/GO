name: C02-C12 isolated integration candidate
on:
  pull_request:
    branches: [main]
    paths:
      - application/**
      - ci/integration/**
      - .github/workflows/c02-c12-isolated-integration.yml
permissions:
  contents: read
concurrency:
  group: c02-c12-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  accepted-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: go_integration_isolated
          POSTGRES_USER: go_ci
          POSTGRES_PASSWORD: isolated_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U go_ci -d go_integration_isolated"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DATABASE_URL: postgresql+psycopg://go_ci:isolated_ci_only@127.0.0.1:5432/go_integration_isolated
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://go_ci:isolated_ci_only@127.0.0.1:5432/go_integration_isolated
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Bind candidate identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:application)" = "12c06ac84175458b936aa92a065ad17007712bce"
          mkdir -p "$RUNNER_TEMP/integration-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/integration-evidence/candidate_sha.txt"
          git rev-parse HEAD:application | tee "$RUNNER_TEMP/integration-evidence/application_tree.txt"
          git ls-tree -r HEAD:application | sha256sum | cut -d' ' -f1 | tee "$RUNNER_TEMP/integration-evidence/application_fingerprint_sha256.txt"
      - name: Install application
        working-directory: application
        run: python -m pip install '.[dev]'
      - name: Upgrade isolated PostgreSQL schema
        working-directory: application
        run: alembic upgrade head
      - name: Run accepted Cell integration scope
        working-directory: application
        run: |
          pytest \
            tests/test_v70_r3_c02_coupon_authority.py \
            tests/test_v70_r6_c02_partial_party_authority.py \
            tests/test_v70_r3_c04_admin_reconciliation.py \
            tests/test_v70_r3_c04_http_get_zero_write.py \
            tests/test_v70_r4_c05_episode_reference_reuse.py \
            tests/test_v70_r4_c05_failed_episode.py \
            tests/test_v70_r5_c05_concurrent_unknown.py \
            tests/test_c06_internal_policy_registry.py \
            tests/test_next_depth_c06_supplier_validity.py \
            tests/test_v70_r5_c06_raw_payload_binding.py \
            tests/test_v70_r4_c07_consent_provenance.py \
            tests/go_ai/test_c08_durable_execution.py \
            tests/test_outbox_resilience.py \
            tests/journey/test_c10_pagination_search.py \
            tests/payments/test_c11_flight_idempotency_recovery.py \
            --junitxml="$RUNNER_TEMP/integration-evidence/junit.xml"
      - name: Bind test evidence
        if: always()
        run: |
          set -euo pipefail
          cp ci/integration/C02_C12_GATE_LEDGER.json "$RUNNER_TEMP/integration-evidence/"
          find "$RUNNER_TEMP/integration-evidence" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/integration-evidence/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c02-c12-isolated-integration-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/integration-evidence
          if-no-files-found: error
          retention-days: 90
