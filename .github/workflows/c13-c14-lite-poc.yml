name: C13/C14 Lite V2 minimal PoC (quota + run/artifact readback)

# POC_ONLY. This workflow produces no C13/C14 opinion and no acceptance record.
# It answers exactly two questions with real infrastructure:
#
#   1. is the configured AI credential actually usable (not quota-exhausted)?
#   2. can a run upload an artifact and re-read its own run/artifact identity,
#      including the GitHub-computed digest, through the read-only API?
#
# It is deliberately tiny so it can be dispatched on a branch without touching any
# production path, and it never deploys, merges or writes to an issue.

on:
  # Branch-and-path scoped push trigger, same pattern as the repository's existing
  # c01-02-c13-independent.yml. It exists for one reason: GitHub cannot dispatch a
  # workflow by name while that workflow exists only on a non-default branch, and
  # the quota / readback proof can only be obtained remotely. It fires ONLY for
  # this file on this implementation branch -- never on main, never for the two
  # production workflows.
  push:
    branches:
      - cc/c13-c14-lite-v2-github-backend-20260925
    paths:
      - .github/workflows/c13-c14-lite-poc.yml
  workflow_dispatch:
    inputs:
      ai_model:
        description: "Model used for the one real API call"
        required: false
        default: "gpt-5.6-sol"

permissions:
  contents: read
  actions: read

env:
  LITE_WORKFLOW_IDENTITY: ".github/workflows/c13-c14-lite-poc.yml"
  # Synthetic candidate: the PoC is not a review of any product candidate.
  LITE_CANDIDATE_SHA: "ffffffffffffffffffffffffffffffffffffffff"
  LITE_APPLICATION_TREE: "ffffffffffffffffffffffffffffffffffffffff"
  LITE_CELL_PAIR: "C13+C14"
  LITE_ISSUE_NUMBER: ""
  LITE_REQUEST_ID: "poc-only-request"
  LITE_LEDGER_ROUND_ID: "POC_ONLY"
  LITE_C14_TASK_ID: "POC-C14-TASK"
  LITE_C13_TASK_ID: "POC-C13-TASK"
  # `inputs` is empty on a push trigger, so the fallback matters here.
  LITE_AI_MODEL: ${{ inputs.ai_model || 'gpt-5.6-sol' }}

jobs:
  poc:
    name: POC_ONLY quota probe and same-run artifact readback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the execution backend
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Freeze the synthetic PoC facts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts/logs"
          LITE_WORKFLOW_SHA="$(git rev-parse HEAD:$LITE_WORKFLOW_IDENTITY)"
          {
            echo "LITE_WORKFLOW_SHA=$LITE_WORKFLOW_SHA"
            echo "LITE_NONCE=poc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$RANDOM"
            echo "LITE_RUN_ID=${GITHUB_RUN_ID}"
            echo "LITE_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "LITE_PRINCIPAL_ID=${GITHUB_ACTOR}"
            echo "LITE_ISSUED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "LITE_EXPIRES_AT=$(date -u -d '+55 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
          python control-plane/c13-c14-lite/lite_cli.py scope \
            --role c14 \
            --rule POC_ONLY \
            --rule-version poc \
            --out "$RUNNER_TEMP/scope.json" > /dev/null
          echo "LITE_SCOPE_SHA256=$(grep -o '[0-9a-f]\{64\}' "$RUNNER_TEMP/scope.json" | head -1)" >> "$GITHUB_ENV"

      # Values appended to $GITHUB_ENV only exist for LATER steps, so the contract
      # must be built in its own step after the scope digest is exported.
      - name: Build the frozen PoC contract
        run: |
          set -euo pipefail
          python control-plane/c13-c14-lite/lite_cli.py spec --role c14 \
            --spec "$RUNNER_TEMP/poc.spec.json" \
            --facts "$RUNNER_TEMP/poc.facts.json" \
            --contract "$RUNNER_TEMP/poc.contract.json" \
            2>&1 | tee "$RUNNER_TEMP/artifacts/logs/spec.log"

      - name: One real AI call (quota probe only)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python control-plane/c13-c14-lite/lite_cli.py review \
            --spec "$RUNNER_TEMP/poc.spec.json" \
            --facts "$RUNNER_TEMP/poc.facts.json" \
            --out "$RUNNER_TEMP/poc.outcome.json" \
            --allow-blocked \
            2>&1 | tee "$RUNNER_TEMP/artifacts/logs/review.log"

      # Runs even when an earlier step failed, so the failure is readable from the
      # artifact instead of the Actions log (the log blob endpoint is not readable
      # with this token).
      - name: Publish the PoC record as an artifact
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts/logs"
          cp "$RUNNER_TEMP/poc.outcome.json" "$RUNNER_TEMP/artifacts/poc.json" 2>/dev/null || true
          cp "$RUNNER_TEMP"/*.json "$RUNNER_TEMP/artifacts/logs/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/*.txt "$RUNNER_TEMP/artifacts/logs/" 2>/dev/null || true
          ls -la "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/artifacts/logs" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c13c14-lite-c14-${{ env.LITE_CANDIDATE_SHA }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: error
          retention-days: 5

      - name: Read back run and artifact identity through the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          python control-plane/c13-c14-lite/lite_readback.py \
            --role c14 \
            --candidate-sha "$LITE_CANDIDATE_SHA" \
            --expected-head-sha "${GITHUB_SHA}" \
            --workflow-path "$LITE_WORKFLOW_IDENTITY" \
            --run-id "${GITHUB_RUN_ID}" \
            --bytes-mode degrade \
            --out "$RUNNER_TEMP/artifacts/readback.json" \
            > "$RUNNER_TEMP/artifacts/logs/readback.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            # Record whether the artifact bytes themselves were re-hashed.
            reason=$(python -c "import json,sys;d=json.load(open(sys.argv[1]));print('BYTES_VERIFIED' if d.get('bytes_verified') else 'BYTES_'+str(d.get('bytes_error') or 'NOT_VERIFIED')[:40])" "$RUNNER_TEMP/artifacts/readback.json" 2>/dev/null | tr -c 'A-Za-z0-9_-' '_')
            echo "RUN_ARTIFACT_READBACK=PASS"
          else
            # Whatever went wrong, the reason must reach the artifact name.
            reason=$(tr -c 'A-Za-z0-9_-' '_' < "$RUNNER_TEMP/artifacts/logs/readback.log" | tail -c 60)
            [ -n "$reason" ] || reason=NO_OUTPUT
          fi
          {
            echo "READBACK_RC=${rc}"
            echo "READBACK_REASON=${reason}"
          } >> "$GITHUB_ENV"
          exit "$rc"

      - name: Publish the readback record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c13c14-lite-c14-readback-${{ env.LITE_CANDIDATE_SHA }}
          path: ${{ runner.temp }}/artifacts/readback.json
          if-no-files-found: warn
          retention-days: 5

      # This step distinguishes the two questions that were previously conflated:
      #   AI_CREDENTIAL_USABLE - did a real provider response come back at all?
      #   AI_REVIEW_VERDICT    - what did that response say (informational)?
      # It fails only when no usable provider response was obtained.
      - name: Report the AI credential status
        if: always()
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP" "$GITHUB_ENV" <<'PY'
          import json, pathlib, sys
          root, envfile = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          try:
              outcome = json.loads((root / "poc.outcome.json").read_text())
          except OSError:
              with envfile.open("a") as handle:
                  handle.write("AI_CREDENTIAL_USABLE=UNKNOWN\n")
                  handle.write("AI_FAILURE_CLASS=REVIEW_NOT_EXECUTED\n")
              print("AI_CREDENTIAL_USABLE=UNKNOWN")
              print("AI_FAILURE_CLASS=REVIEW_NOT_EXECUTED")
              raise SystemExit(1)
          failure = outcome.get("failure_class")
          execution = outcome.get("ai_execution_id")
          ok = failure is None and bool(execution)
          with envfile.open("a") as handle:
              handle.write(f"AI_CREDENTIAL_USABLE={'YES' if ok else 'NO'}\n")
              handle.write(f"AI_FAILURE_CLASS={failure or 'NONE'}\n")
              handle.write(f"AI_REVIEW_VERDICT={outcome.get('verdict') or 'NONE'}\n")
          print(f"AI_CREDENTIAL_USABLE={'YES' if ok else 'NO'}")
          print(f"AI_FAILURE_CLASS={failure or 'NONE'}")
          print(f"AI_REVIEW_VERDICT={outcome.get('verdict')}")
          print(f"AI_PROVIDER={outcome.get('ai_provider')}")
          raise SystemExit(0 if ok else 1)
          PY

      # The artifact NAME is the only machine-readable channel available to this
      # token (job logs and artifact zips both redirect to a storage endpoint it
      # cannot authenticate against), so the verdict is encoded in the name.
      - name: Publish the verdict as an artifact name
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verdict"
          {
            echo "AI_CREDENTIAL_USABLE=${AI_CREDENTIAL_USABLE:-UNKNOWN}"
            echo "AI_FAILURE_CLASS=${AI_FAILURE_CLASS:-UNKNOWN}"
            echo "AI_REVIEW_VERDICT=${AI_REVIEW_VERDICT:-UNKNOWN}"
            echo "READBACK_RC=${READBACK_RC:-UNKNOWN}"
            echo "READBACK_REASON=${READBACK_REASON:-UNKNOWN}"
            echo "POC_ONLY_NO_C13_C14_OPINION=true"
          } > "$RUNNER_TEMP/verdict/verdict.txt"
          cat "$RUNNER_TEMP/verdict/verdict.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c13c14-lite-poc-verdict-credential_${{ env.AI_CREDENTIAL_USABLE || 'UNKNOWN' }}-class_${{ env.AI_FAILURE_CLASS || 'UNKNOWN' }}-verdict_${{ env.AI_REVIEW_VERDICT || 'UNKNOWN' }}-readback_${{ env.READBACK_REASON || 'UNKNOWN' }}
          path: ${{ runner.temp }}/verdict
          if-no-files-found: warn
          retention-days: 5

      - name: POC summary
        if: always()
        run: |
          echo "POC_ONLY_NO_C13_C14_OPINION=true"
          echo "VERDICT_IS_IN_THE_ARTIFACT_NAME=c13c14-lite-poc-verdict-*"
