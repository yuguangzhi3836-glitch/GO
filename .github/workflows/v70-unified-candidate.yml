name: V70 current Cells unified candidate gate
on:
  pull_request:
    branches: [main]
    paths: [application/**, ci/integration/**, ci/retention/**, ci/cell-closure/**, ci/next-depth/**, ci/shared_evidence/**, .github/workflows/v70-unified-candidate.yml]
permissions:
  contents: read
concurrency:
  group: v70-unified-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exact-unified-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: go_unified
          POSTGRES_USER: go_ci
          POSTGRES_PASSWORD: isolated_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U go_ci -d go_unified"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .:src
      DATABASE_URL: postgresql+psycopg://go_ci:isolated_ci_only@127.0.0.1:5432/go_unified
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://go_ci:isolated_ci_only@127.0.0.1:5432/go_unified
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Verify exact unified binding
        id: binding
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unified/source"
          python ci/retention/verify_source.py "$RUNNER_TEMP/unified/source"
          python ci/retention/verify_alignment.py "$RUNNER_TEMP/unified/source/ALIGNMENT_RESULT.json"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          b=json.loads(Path('ci/retention/BASELINE.json').read_text())
          assert subprocess.check_output(['git','rev-parse',b['product_candidate_commit']+':application'],text=True).strip()==b['application_git_tree']
          for p in ['ci/cell-closure/CANDIDATE.json','ci/next-depth/CANDIDATE.json']:
              c=json.loads(Path(p).read_text())
              for k in ['product_candidate_commit','application_git_tree','source_tree_sha256']:
                  assert c[k]==b[k], (p,k)
          assert Path('ci/integration/SOURCE_FINGERPRINT.sha256').read_text().strip()==b['source_tree_sha256']
          PY
      - name: Shared checksum writer focused gate
        id: hygiene
        run: python -m unittest ci.shared_evidence.test_write_sha256s -v
      - name: Install application
        id: dependencies
        working-directory: application
        run: python -m pip install '.[dev]'
      - name: Upgrade isolated integrated PostgreSQL schema
        id: migration
        working-directory: application
        run: |
          set -euo pipefail
          alembic upgrade head
          alembic current | tee "$RUNNER_TEMP/unified/migration.log"
      - name: Validate composed C01 integration boundary
        id: integration
        working-directory: application
        run: |
          set -euo pipefail
          pytest tests/test_v70_r4_c01_unknown_episode.py tests/test_v70_next_c01_authorization_replay.py tests/test_v70_next_c01_unknown_funding.py tests/test_depth18_regional_queue.py --junitxml="$RUNNER_TEMP/unified/junit.xml" 2>&1 | tee "$RUNNER_TEMP/unified/pytest.log"
      - name: Preserve C12 control-plane compatibility
        id: c12
        run: |
          set -euo pipefail
          python -m unittest ci.round2.test_c12_worker_liveness -v 2>&1 | tee "$RUNNER_TEMP/unified/c12.log"
      - name: Bind truthful source and test Evidence
        if: always()
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BINDING: ${{ steps.binding.outcome }}
          HYGIENE: ${{ steps.hygiene.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          MIGRATION: ${{ steps.migration.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          C12: ${{ steps.c12.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unified"
          cp ci/integration/ACCEPTED_CELL_LEDGER.json "$RUNNER_TEMP/unified/"
          git diff --name-only febb925eeb781223f17002b91479f2eac9b71acc HEAD > "$RUNNER_TEMP/unified/CHANGED_FILES.txt"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'unified'
          steps={k:os.environ[k] for k in ['BINDING','HYGIENE','DEPENDENCIES','MIGRATION','INTEGRATION','C12']}
          b=json.loads(Path('ci/retention/BASELINE.json').read_text())
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert actual==os.environ['CANDIDATE_SHA']
          report={'candidate_sha':actual,'application_tree':subprocess.check_output(['git','rev-parse','HEAD:application'],text=True).strip(),'source_fingerprint_sha256':b['source_tree_sha256'],'steps':steps,'status':'PASS' if all(v=='success' for v in steps.values()) else 'FAIL','scope':'unified binding, shared hygiene, isolated PG migration, composed C01 integration, C12 compatibility; parent regression is separate','inherited_nine_cell_jobs':'NOT_RERUN','c06_external':'HOLD','hk_staging':'HOLD','final_release':'HOLD','production':'HOLD'}
          (out/'RESULT.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          python ci/shared_evidence/write_sha256s.py "$RUNNER_TEMP/unified" "$RUNNER_TEMP/unified/SHA256SUMS"
          (cd "$RUNNER_TEMP/unified" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v70-unified-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/unified
          if-no-files-found: error
          retention-days: 90
