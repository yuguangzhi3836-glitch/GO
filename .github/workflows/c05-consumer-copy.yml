name: C05 consumer copy governance

on:
  pull_request:
    branches:
      - fix/aoluguya-hero-public-gallery-20260918
    paths:
      - 'application/mobile/go-app/**'
      - '.github/workflows/c05-consumer-copy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: cd6345e32dd258c7f11f0766a36a168bad99a7f5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind exact revision and preserve B/admin trees
        run: |
          set -euo pipefail
          mkdir -p evidence
          head_sha="$(git rev-parse HEAD)"
          head_tree="$(git show -s --format=%T HEAD)"
          app_tree="$(git rev-parse HEAD:application)"
          admin_base="$(git rev-parse "${BASE_SHA}:application/frontend/admin")"
          admin_head="$(git rev-parse HEAD:application/frontend/admin)"
          supplier_base="$(git rev-parse "${BASE_SHA}:application/frontend/supplier")"
          supplier_head="$(git rev-parse HEAD:application/frontend/supplier)"
          test "$admin_base" = "$admin_head"
          test "$supplier_base" = "$supplier_head"
          {
            echo "base_sha=${BASE_SHA}"
            echo "head_sha=${head_sha}"
            echo "head_tree=${head_tree}"
            echo "application_tree=${app_tree}"
            echo "admin_tree=${admin_head}"
            echo "supplier_tree=${supplier_head}"
          } | tee evidence/BINDING.txt
          git diff --name-only "${BASE_SHA}" HEAD | tee evidence/CHANGED_FILES.txt
          if grep -Eq '^application/frontend/(admin|supplier)/' evidence/CHANGED_FILES.txt; then
            echo "B/admin diagnostic surface changed" >&2
            exit 1
          fi

      - name: Run mobile Chinese copy contract
        working-directory: application/mobile/go-app
        run: |
          set -euo pipefail
          node scripts/contract-check.mjs | tee ../../../evidence/CONTRACT_RAW.txt

      - name: Scan consumer runtime sources
        run: |
          set -euo pipefail
          targets=(application/mobile/go-app/src)
          if test -d application/frontend/consumer; then targets+=(application/frontend/consumer); fi
          if grep -RInE --include='*.tsx' --include='*.ts' --include='*.jsx' --include='*.js' --include='*.vue' --include='*.html' '模拟体验|模拟数据|模拟 Token' "${targets[@]}" | tee evidence/CONSUMER_COPY_SCAN.txt; then
            echo "consumer-visible simulation notice remains" >&2
            exit 1
          fi
          echo "PASS: no prohibited consumer simulation notice" | tee evidence/CONSUMER_COPY_SCAN.txt

      - name: Typecheck mobile frontend
        working-directory: application/mobile/go-app
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck | tee ../../../evidence/TYPECHECK_RAW.txt

      - name: Seal evidence
        if: always()
        run: |
          set -euo pipefail
          (
            cd evidence
            sha256sum BINDING.txt CHANGED_FILES.txt CONSUMER_COPY_SCAN.txt CONTRACT_RAW.txt TYPECHECK_RAW.txt > SHA256SUMS
          )
          cat evidence/SHA256SUMS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c05-consumer-copy-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
