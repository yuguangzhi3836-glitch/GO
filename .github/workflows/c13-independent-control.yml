  c13-pr228:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      C13_CANDIDATE_SHA: 545e078db4a7fe24b56758baa365c335cabf7106
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 545e078db4a7fe24b56758baa365c335cabf7106
          persist-credentials: false
      - name: Bind exact candidate
        run: test "$(git rev-parse HEAD)" = "$C13_CANDIDATE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test dependencies
        run: python -m pip install pytest cryptography
      - name: Run restricted action and bridge regression
