          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c13"
          pytest -q --junitxml="$RUNNER_TEMP/c13/JUNIT.xml" tests/test_c13_registration_email.py 2>&1 | tee "$RUNNER_TEMP/c13/stdout.log"
