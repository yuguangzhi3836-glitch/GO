name: Command Center control state (isolated)
on:
  push:
    branches: [cc/github-native-delivery-v1]
    paths:
      - 'control-plane/command-center-state-v1/**'
      - '.github/workflows/command-center-state-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'control-plane/command-center-state-v1/**'
      - '.github/workflows/command-center-state-v1.yml'
permissions:
  contents: read
concurrency:
  group: cc-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  isolated-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned test dependency
        run: python -m pip install cryptography==46.0.0
      - name: Check source manifest
        working-directory: control-plane/command-center-state-v1
        run: sha256sum -c SHA256SUMS
      - name: Run checks with network, subprocess and runtime paths forbidden
        run: python control-plane/command-center-state-v1/run_checks.py "$RUNNER_TEMP/cc-state-checks"
      - name: Rebuild the projection from a synthetic control bus and bind the commit
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'cc-state-checks'
          fixture=out/'fixture'; (fixture/'tasks').mkdir(parents=True); (fixture/'evidence').mkdir()
          root=pathlib.Path('control-plane/command-center-state-v1')
          sys.path.insert(0,str(root))
          import state_projection as sp
          task={"schema_version":"1","task_id":"task-ci-fixture","nonce":"nonce-ci",
                "issued_at":"2026-09-14T11:30:00Z","expires_at":"2026-09-14T11:45:00Z",
                "authority":"GO-COMMAND-CENTER","environment":"HK-STAGING-01",
                "action_id":"HK_STAGING_VERIFY","signature":"0"*128,
                "parameters":{"release_id":"release-ci",
                              "candidate_image_id":"sha256:"+"a"*64,
                              "expected_current_image_id":"sha256:"+"a"*64}}
          evidence={"schema_version":"1","task_id":task["task_id"],"nonce":task["nonce"],
                    "action_id":task["action_id"],"environment":task["environment"],
                    "status":"SUCCESS","started_at":"2026-09-14T11:35:00Z",
                    "completed_at":"2026-09-14T11:35:20Z","agent_version":"fixture",
                    "executor_version":"fixture","executor_result":"VERIFY_OK",
                    "gate_results":{"api_health":"PASS"},
                    "signature":__import__('base64').b64encode(b"0"*64).decode()}
          (fixture/'tasks'/'t.json').write_text(json.dumps(task))
          (fixture/'evidence'/'e.json').write_text(json.dumps(evidence))
          run=[sys.executable,str(root/'state_projection.py'),'--tasks-repo',str(fixture),
               '--evidence-repo',str(fixture),'--now','2026-09-14T12:00:00Z','--out',str(out/'state')]
          first=subprocess.run(run,capture_output=True,text=True,check=True).stdout
          second=subprocess.run(run,capture_output=True,text=True,check=True).stdout
          assert first==second, 'projection is not deterministic'
          status=json.loads((out/'state'/'CONTROL_STATUS_V1.json').read_text())
          assert status['authority']=='DERIVED_NON_AUTHORITATIVE'
          assert status['answers']['hk_agent_online']['state']=='UNKNOWN', 'unverified must not claim PROVEN'
          assert status['verdict']['healthy']['state'] in ('OBSERVED','PROVEN')
          binding={'event':os.environ['GITHUB_EVENT_NAME'],'workflow_commit':os.environ['GITHUB_SHA'],
                   'run_id':os.environ['GITHUB_RUN_ID'],
                   'projection_sha256':hashlib.sha256((out/'state'/'CURRENT_CONTROL_STATE.json').read_bytes()).hexdigest(),
                   'deterministic':True,'installation_performed':False,'deployment_performed':False,
                   'hong_kong_accessed':False,'production_accessed':False}
          (out/'binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          print(json.dumps(binding,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc-control-state-${{ github.sha }}
          path: ${{ runner.temp }}/cc-state-checks/
          if-no-files-found: error
          retention-days: 30
