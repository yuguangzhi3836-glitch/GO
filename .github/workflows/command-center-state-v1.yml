name: Command Center control state (isolated)
on:
  push:
    branches: [cc/github-native-delivery-v1, cc/v1-finalization-20260914]
    paths:
      - 'control-plane/command-center-state-v1/**'
      # The projector now pins its gate set against the evaluator's own source and
      # consumes the evaluator's real output, so a change on either side has to run
      # this job. Without these paths a gate added to the evaluator alone would
      # break the live projection and no workflow here would say so.
      - 'control-plane/command-center-deploy-readiness-v1/**'
      - '.github/workflows/command-center-state-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'control-plane/command-center-state-v1/**'
      - 'control-plane/command-center-deploy-readiness-v1/**'
      - '.github/workflows/command-center-state-v1.yml'
permissions:
  contents: read
concurrency:
  group: cc-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  isolated-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned test dependency
        run: python -m pip install cryptography==46.0.0
      - name: Check source manifest
        working-directory: control-plane/command-center-state-v1
        run: sha256sum -c SHA256SUMS
      - name: Run checks with network, subprocess and runtime paths forbidden
        run: python control-plane/command-center-state-v1/run_checks.py "$RUNNER_TEMP/cc-state-checks"
      - name: Project a synthetic bus and prove signer-identity separation end to end
        run: |
          python - <<'PY'
          import base64, datetime as dt, hashlib, json, os, pathlib, subprocess, sys
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cc-state-checks'
          root = pathlib.Path('control-plane/command-center-state-v1')
          sys.path.insert(0, str(root))
          import state_projection as sp

          keys = out / 'keys'; keys.mkdir(parents=True, exist_ok=True)
          def newkey(name):
              key = Ed25519PrivateKey.generate()
              (keys / f'{name}.pem').write_bytes(key.private_bytes(
                  serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8,
                  serialization.NoEncryption()))
              (keys / f'{name}.pub').write_bytes(key.public_key().public_bytes(
                  serialization.Encoding.PEM, serialization.PublicFormat.SubjectPublicKeyInfo))
              return key
          task_key, evidence_key = newkey('cc-task'), newkey('hk-evidence')
          newkey('wrong-role')

          # CC V1-01: a key is only trusted when it matches a published identity.
          def pin(pub_name):
              return sp.Verifier(str(keys / pub_name), 'pin', 'hex').ssh_fingerprint
          contract = out / 'VERIFIER_IDENTITIES_V1.json'
          contract.write_text(json.dumps({
              'schema_version': '1', 'contract': 'VERIFIER_IDENTITIES_V1',
              'identities': [
                  {'identity_id': 'CI-CC-TASK-SIGNER', 'role': 'TASK', 'algorithm': 'Ed25519',
                   'signature_encoding': 'hex', 'public_key_ssh_sha256': pin('cc-task.pub')},
                  {'identity_id': 'CI-HK-EVIDENCE-SIGNER', 'role': 'EVIDENCE',
                   'algorithm': 'Ed25519', 'signature_encoding': 'base64',
                   'public_key_ssh_sha256': pin('hk-evidence.pub')}]}))
          assert pin('cc-task.pub') != pin('hk-evidence.pub'), 'fixture pins collided'

          def sign(obj, key, encoding):
              raw = key.sign(sp.canonical({k: v for k, v in obj.items() if k != 'signature'}))
              out = {k: v for k, v in obj.items() if k != 'signature'}
              out['signature'] = raw.hex() if encoding == 'hex' else base64.b64encode(raw).decode()
              return out

          issued = dt.datetime(2026, 9, 14, 11, 30, tzinfo=dt.timezone.utc)
          task = {'schema_version': '1', 'task_id': 'task-ci-fixture', 'nonce': 'nonce-ci',
                  'issued_at': '2026-09-14T11:30:00Z', 'expires_at': '2026-09-14T11:45:00Z',
                  'authority': 'GO-COMMAND-CENTER', 'environment': 'HK-STAGING-01',
                  'action_id': 'HK_STAGING_VERIFY', 'signature': '0' * 128,
                  'parameters': {'release_id': 'release-ci',
                                 'candidate_image_id': 'sha256:' + 'a' * 64,
                                 'expected_current_image_id': 'sha256:' + 'a' * 64}}
          evidence = {'schema_version': '1', 'task_id': task['task_id'], 'nonce': task['nonce'],
                      'action_id': task['action_id'], 'environment': task['environment'],
                      'status': 'SUCCESS', 'started_at': '2026-09-14T11:35:00Z',
                      'completed_at': '2026-09-14T11:35:20Z', 'agent_version': 'fixture',
                      'executor_version': 'fixture', 'executor_result': 'VERIFY_OK',
                      'gate_results': {'api_health': 'PASS'},
                      'signature': base64.b64encode(b'0' * 64).decode()}

          def run_bus(label, task_obj, evidence_obj, task_key_name='cc-task.pub',
                      evidence_key_name='hk-evidence.pub'):
              bus = out / label; (bus / 'tasks').mkdir(parents=True, exist_ok=True)
              (bus / 'evidence').mkdir(parents=True, exist_ok=True)
              (bus / 'tasks' / 't.json').write_text(json.dumps(task_obj))
              (bus / 'evidence' / 'e.json').write_text(json.dumps(evidence_obj))
              run = [sys.executable, str(root / 'state_projection.py'),
                     '--tasks-repo', str(bus), '--evidence-repo', str(bus),
                     '--now', '2026-09-14T12:00:00Z', '--out', str(bus / 'state'),
                     '--verifier-identities', str(contract)]
              if task_key_name:
                  run += ['--task-verify-key', str(keys / task_key_name)]
              if evidence_key_name:
                  run += ['--evidence-verify-key', str(keys / evidence_key_name)]
              subprocess.run(run, capture_output=True, text=True, check=True)
              return json.loads((bus / 'state' / 'CURRENT_CONTROL_STATE.json').read_text())

          good = run_bus('separated', sign(task, task_key, 'hex'),
                         sign(evidence, evidence_key, 'base64'))
          entry = good['tasks'][0]
          assert good['verification']['identities_separated'] is True, 'identities not separated'
          assert entry['task_signature_verified'] is True, 'task signature did not verify'
          assert entry['evidence']['signature_verified'] is True, 'evidence signature did not verify'
          assert entry['lifecycle'] == 'COMPLETE', entry['lifecycle']
          assert entry['assertion']['state'] == 'PROVEN', entry['assertion']['state']
          assert good['verification']['identity_contract']['state'] == 'LOADED', 'contract not loaded'
          assert good['verification']['proven_allowed'] is True, 'binding gate closed on a good run'
          assert good['verification']['fail_closed_reasons'] == [], \
                 good['verification']['fail_closed_reasons']
          for role in ('task', 'evidence'):
              assert good['verification'][role]['identity_binding'] == 'BOUND', role
              assert good['verification'][role]['ssh_sha256_fingerprint'] == \
                     good['verification'][role]['expected_ssh_sha256_fingerprint'], role

          crossed_key = run_bus('wrong-key', sign(task, task_key, 'hex'),
                                sign(evidence, evidence_key, 'base64'),
                                task_key_name='wrong-role.pub')
          assert crossed_key['verification']['task']['identity_binding'] == 'IDENTITY_MISMATCH', \
                 'a key that is not the published identity was accepted'
          assert crossed_key['verification']['evidence']['identity_binding'] == 'BOUND'
          assert crossed_key['verification']['proven_allowed'] is False, 'wrong key reached PROVEN'
          assert 'task:IDENTITY_MISMATCH' in crossed_key['verification']['fail_closed_reasons']
          assert crossed_key['tasks'][0]['assertion']['state'] != 'PROVEN'

          cross = run_bus('crossed', sign(task, task_key, 'hex'),
                          sign(evidence, task_key, 'base64'))
          crossed = cross['tasks'][0]
          assert crossed['evidence']['signature_verified'] is False, 'crossed evidence verified'
          assert crossed['lifecycle'] == 'EVIDENCE_INVALID', crossed['lifecycle']
          assert crossed['assertion']['state'] != 'PROVEN', 'crossed key produced PROVEN'

          cross_task = run_bus('crossed-task', sign(task, evidence_key, 'hex'),
                               sign(evidence, evidence_key, 'base64'))
          assert cross_task['tasks'][0]['task_signature_verified'] is False, 'crossed task verified'
          assert cross_task['tasks'][0]['lifecycle'] == 'POLICY_HOLD'
          # The key is the right one for the role; it is the artifact that is crossed.
          assert cross_task['verification']['task']['identity_binding'] == 'BOUND'

          crossed_identity = run_bus('crossed-identity', sign(task, task_key, 'hex'),
                                     sign(evidence, evidence_key, 'base64'),
                                     task_key_name='hk-evidence.pub')
          assert crossed_identity['verification']['task']['identity_binding'] == \
                 'IDENTITY_MISMATCH', 'the evidence key was accepted in the task role'
          assert crossed_identity['verification']['evidence']['identity_binding'] == 'BOUND'
          assert crossed_identity['verification']['proven_allowed'] is False
          assert crossed_identity['tasks'][0]['assertion']['state'] != 'PROVEN'

          unsigned = run_bus('unsigned', task, evidence,
                             task_key_name=None, evidence_key_name=None)
          assert unsigned['tasks'][0]['task_signature_verified'] is None, 'missing key not reported'
          assert unsigned['tasks'][0]['evidence']['signature_verified'] is None
          assert unsigned['tasks'][0]['lifecycle'] == 'EVIDENCE_PUBLISHED'
          assert unsigned['tasks'][0]['assertion']['state'] == 'OBSERVED', 'missing keys claimed more'
          assert unsigned['verification']['task']['signature_verification'] == 'NOT_PERFORMED'
          assert unsigned['verification']['task']['identity_binding'] == 'MISSING_KEY'
          assert unsigned['verification']['evidence']['identity_binding'] == 'MISSING_KEY'
          assert unsigned['verification']['proven_allowed'] is False, 'missing keys reached PROVEN'

          collision = run_bus('collision', sign(task, task_key, 'hex'),
                              sign(evidence, evidence_key, 'base64'),
                              evidence_key_name='cc-task.pub')
          assert collision['verification']['identities_separated'] is False, 'collision not detected'
          assert 'VERIFIER_IDENTITY_COLLISION' in [a['kind'] for a in collision['anomalies']]
          assert collision['tasks'][0]['assertion']['state'] != 'PROVEN', 'collision produced PROVEN'
          assert collision['verification']['proven_allowed'] is False

          status = json.loads((out / 'separated' / 'state' / 'CONTROL_STATUS_V1.json').read_text())
          first = (out / 'separated' / 'state' / 'CURRENT_CONTROL_STATE.json').read_text()
          assert status['authority'] == 'DERIVED_NON_AUTHORITATIVE'
          assert status['scope'] == 'CONTROL_STATE_AND_STATUS_ONLY'
          assert status['answers']['hk_agent_online']['state'] == 'UNKNOWN', 'liveness was inferred'
          assert status['answers']['stuck_tasks']['answer']['value'] == 'NO'
          assert status['answers']['runtime_verification']['value']['verdict'] == 'UNKNOWN', \
                 'a repository pointer was fabricated'
          assert status['answers']['repository_declared_runtime']['state'] == 'UNKNOWN'
          channel = status['answers']['request_channel']
          assert list(channel['enabled_human_request_actions']) == \
                 ['HK_STAGING_VERIFY', 'HK_STAGING_TEST_PR'], 'deploy leaked into enabled actions'
          assert list(channel['human_request_actions']) == \
                 ['HK_STAGING_VERIFY', 'HK_STAGING_TEST_PR', 'HK_STAGING_DEPLOY'], \
                 'the human action set lost or gained an action'
          assert list(channel['platform_request_actions']) == ['CONTROL_PLANE_HEALTH']
          assert 'CONTROL_PLANE_HEALTH' not in channel['human_request_actions'], \
                 'a platform probe was promoted into a human action'
          assert list(channel['enabled_request_actions']) == \
                 ['HK_STAGING_VERIFY', 'HK_STAGING_TEST_PR', 'CONTROL_PLANE_HEALTH']
          assert channel['request_action_source_class']['CONTROL_PLANE_HEALTH'] == \
                 'PLATFORM_AUTOMATION'
          health = channel['platform_action_properties']['CONTROL_PLANE_HEALTH']
          assert health['parameters'] == {} and health['read_only'] is True
          assert health['human_deploy_authority'] is False, 'a probe gained deploy authority'
          assert channel['capability_classification']['CONTROL_PLANE_HEALTH'] == \
                 'SUPPORTED_PROVEN_PLATFORM_ONLY'
          assert channel['deploy_request_enabled'] is False
          assert channel['readiness_evaluation'] == 'NOT_IN_SCOPE'
          # The liveness window must carry transport margin over the probe cadence.
          freshness = good['freshness']
          assert freshness['liveness_probe_interval_seconds'] == 1800
          assert freshness['liveness_transport_grace_seconds'] == 600
          assert freshness['liveness_window_seconds'] == 2400
          assert freshness['liveness_max_probes_per_24h'] == 48, 'the probe budget moved'

          required = {'hk_agent_recent_activity', 'active_tasks', 'last_task', 'pr_tested',
                      'verify', 'repository_declared_runtime', 'runtime_verification',
                      'stuck_tasks', 'last_failure', 'request_channel'}
          assert required <= set(status['answers']), 'a required status answer is missing'
          for key in ('can_deploy', 'rollback_targets', 'release_gates', 'deployment_eligibility',
                      'deploy_ready', 'rollback_ready'):
              assert key not in status['answers'], '%s must not be a contract answer' % key
          assert status['out_of_scope']['deploy_readiness_evaluation'] == 'NOT_IN_SCOPE'
          assert status['out_of_scope']['rollback_readiness_evaluation'] == 'NOT_IN_SCOPE'
          assert 'blockers' not in status['verdict'], 'verdict must carry only the health answer'

          capability = good['control_state']['deploy_capability']
          assert capability['value']['capability'] == 'CAPABILITY_PRESENT_BUT_DISABLED'
          assert capability['value']['request_enabled'] is False
          assert capability['value']['readiness_evaluation'] == 'NOT_IN_SCOPE'
          assert good['control_state']['informational']['contract'] is False
          assert good['control_state']['out_of_scope']['deploy_readiness_evaluation'] == 'NOT_IN_SCOPE'

          assert sp.LOCAL_PATH_RE.findall(first) == [], 'local path leaked into the projection'
          assert sp.LOCAL_PATH_RE.findall(json.dumps(status)) == [], 'local path leaked into status'

          binding = {'event': os.environ['GITHUB_EVENT_NAME'], 'workflow_commit': os.environ['GITHUB_SHA'],
                     'run_id': os.environ['GITHUB_RUN_ID'],
                     'projection_sha256': hashlib.sha256(first.encode()).hexdigest(),
                     'deterministic': True, 'signer_identity_separation': 'PROVEN',
                     'verifier_identity_contract': 'LOADED',
                     'task_identity_binding': 'BOUND',
                     'evidence_identity_binding': 'BOUND',
                     'wrong_key_rejected': True,
                     'crossed_identity_rejected': True,
                     'missing_key_never_proven': True,
                     'published_private_keys': 'NONE',
                     'installation_performed': False, 'deployment_performed': False,
                     'deploy_request_enabled': False,
                     'deploy_readiness_evaluation': 'NOT_IN_SCOPE',
                     'rollback_readiness_evaluation': 'NOT_IN_SCOPE',
                     'hong_kong_accessed': False, 'production_accessed': False}
          (out / 'binding.json').write_text(json.dumps(binding, indent=2) + '\n')
          print(json.dumps(binding, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc-control-state-${{ github.sha }}
          path: ${{ runner.temp }}/cc-state-checks/
          if-no-files-found: error
          retention-days: 30
