name: Isolated application CPU hotspot discovery
on:
  pull_request:
    paths:
      - 'ci/cpu_hotspots/**'
      - '.github/workflows/cpu-hotspots.yml'
permissions:
  contents: read
concurrency:
  group: cpu-hotspots-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: go_ci
          POSTGRES_PASSWORD: isolated_multi_only
          POSTGRES_DB: go_c11_isolated
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U go_ci -d go_c11_isolated" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      GO_MULTI_DATABASE_URL: postgresql+psycopg://go_ci:isolated_multi_only@127.0.0.1:5432/go_c11_isolated
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Detect CPU probe definition changes
        id: change
        run: |
          if git diff --quiet HEAD^ HEAD -- ci/cpu_hotspots .github/workflows/cpu-hotspots.yml; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.change.outputs.run == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install -e './application[dev]'
        if: steps.change.outputs.run == 'true'
      - run: python -m pip install yappi==1.7.6
        if: steps.change.outputs.run == 'true'
      - name: Validate thread CPU accounting
        if: steps.change.outputs.run == 'true'
        run: python -m pytest ci/cpu_hotspots/test_thread_profile.py -q
      - name: Control then thread CPU discovery
        if: steps.change.outputs.run == 'true'
        run: python ci/cpu_hotspots/run.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.change.outputs.run == 'true'
        with:
          name: cpu-hotspots-${{ github.event.pull_request.head.sha }}
          path: cpu-hotspot-evidence/
          retention-days: 30
