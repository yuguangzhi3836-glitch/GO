name: C04 PostgreSQL HTTP GET zero-write
on:
  push:
    branches: [cell/c04-v70-r3-05-http-get-zero-write]
  pull_request:
    branches: [cell/c04-v70-r3-04-pg-get-zero-write]
permissions:
  contents: read
jobs:
  c04-http-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: go
          POSTGRES_PASSWORD: go
          POSTGRES_DB: go_hotel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U go -d go_hotel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://go:go@localhost:5432/go_hotel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install frozen dependencies
        run: |
          python ci/retention/dependencies.py --repository . --output "$RUNNER_TEMP/frozen"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/frozen/wheelhouse" -r ci/retention/requirements.lock
      - name: Run HTTP GET zero-write test on PostgreSQL
        run: |
          mkdir -p evidence-out
          python - <<'PY'
          from pathlib import Path
          p=Path("application/tests/conftest.py")
          s=p.read_text()
          old='os.environ["DATABASE_URL"] = f"sqlite+pysqlite:///{DB}"'
          assert old in s
          p.write_text(s.replace(old, 'os.environ.setdefault("DATABASE_URL", f"sqlite+pysqlite:///{DB}")'))
          PY
          git diff -- application/tests/conftest.py > evidence-out/temporary-harness.patch
          cd application
          set -o pipefail
          python -m pytest -p no:cacheprovider tests/test_v70_r3_c04_http_get_zero_write.py -vv --junitxml=../evidence-out/junit.xml 2>&1 | tee ../evidence-out/raw.log
          cd ..
          git checkout -- application/tests/conftest.py
          test -z "$(git diff -- application/tests/conftest.py)"
          git rev-parse HEAD > evidence-out/candidate.txt
          git rev-parse HEAD:application > evidence-out/application-tree.txt
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          app=Path("application")
          hashes={}
          for folder in ["src","frontend","alembic","tests","tests_frontend"]:
              root=app/folder
              if not root.exists():
                  continue
              for p in root.rglob("*"):
                  if p.is_file() and "__pycache__" not in p.parts and p.suffix not in {".pyc",".pyo"}:
                      hashes[p.relative_to(app).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          digest=hashlib.sha256("".join(f"{p}\\0{h}\\n" for p,h in sorted(hashes.items())).encode()).hexdigest()
          fingerprint_path=Path("evidence-out/SOURCE_FINGERPRINT.json")
          fingerprint_path.write_text(json.dumps(hashes,sort_keys=True,indent=2)+chr(10))
          json.loads(fingerprint_path.read_text())
          Path("evidence-out/source-fingerprint-sha256.txt").write_text(digest+chr(10))
          PY
          sha256sum evidence-out/* > evidence-out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: c04-pg-http-get-zero-write
          path: evidence-out
          retention-days: 90
