name: depth29-isolated-source-acceptance
on:
  pull_request:
    branches: ['deliverables/cp11-depth29-trip-reentry']
    paths:
      - '.github/workflows/depth29-isolated.yml'
      - 'ci/depth29/**'
permissions:
  contents: read
jobs:
  isolated:
    if: github.head_ref == 'acceptance/cp11-depth29-isolated'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SEALED_CANDIDATE: 0451fb095c6fe4a185dcf30931166cebdf27e381
      EXPECTED_SOURCE_TREE: ffcea37a3d2ce626026571c1d16eb7be190bd1b048b6b8dfd0d6c8164f2b556c
    steps:
      - name: Checkout isolated acceptance tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tooling
          persist-credentials: false
      - name: Checkout exact candidate archive
        uses: actions/checkout@v4
        with:
          ref: 0451fb095c6fe4a185dcf30931166cebdf27e381
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Verify candidate and archive checksums
        shell: bash
        run: |
          mkdir -p evidence
          git -C candidate rev-parse HEAD | tee evidence/candidate-commit.txt
          test "$(git -C candidate rev-parse HEAD)" = "$SEALED_CANDIDATE"
          cd candidate/deliverables/CP11_DEPTH29_TRIP_REENTRY_20260909
          sha256sum -c SHA256SUMS | tee ../../../evidence/package-checksums.log
      - name: Restore pinned parent chain and DEPTH29 including native and root configs
        shell: bash
        run: |
          python tooling/ci/depth29/materialize_parent.py \
            --depth26 candidate/deliverables/CP11_DEPTH26_20260909 \
            --depth27 candidate/deliverables/CP11_DEPTH27_20260909 \
            --depth28 candidate/deliverables/CP11_DEPTH28_V14_INTEGRATION_20260909 \
            --output "$GITHUB_WORKSPACE/restored-parent" | tee evidence/parent-restore.log
          python candidate/deliverables/CP11_DEPTH29_TRIP_REENTRY_20260909/restore_depth29.py \
            --parent "$GITHUB_WORKSPACE/restored-parent" \
            --output "$GITHUB_WORKSPACE/restored" | tee evidence/restore.log
      - name: Install exact frozen repository wheelhouse into disposable virtualenv
        shell: bash
        run: |
          python tooling/ci/depth29/dependencies.py --repository candidate --output dependencies | tee evidence/dependencies.json
          python -m venv isolated-runtime
          isolated-runtime/bin/python -m pip install --no-index --no-deps --find-links dependencies/wheelhouse -r tooling/ci/depth29/requirements.lock
          isolated-runtime/bin/python -m pip freeze > evidence/pip-freeze.txt
      - name: Bind complete candidate source and runtime versions
        shell: bash
        run: |
          isolated-runtime/bin/python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          fp=json.loads(pathlib.Path('candidate/deliverables/CP11_DEPTH29_TRIP_REENTRY_20260909/SOURCE_FINGERPRINT.json').read_text())
          for name,expected in fp.items():
              assert hashlib.sha256((pathlib.Path('restored')/name).read_bytes()).hexdigest()==expected,name
          tree=hashlib.sha256(''.join(f'{k}\0{v}\n' for k,v in sorted(fp.items())).encode()).hexdigest()
          assert tree==os.environ['EXPECTED_SOURCE_TREE'] and len(fp)==1207
          result={'candidate':os.environ['SEALED_CANDIDATE'],'source_tree_sha256':tree,'verified_files':len(fp),'python':sys.version,'node':subprocess.check_output(['node','--version'],text=True).strip(),'environment':'GitHub disposable runner; SQLite TestClient and VM/native pure functions; no service credentials','three_end_real_ux_login':'HOLD','six_vertical_real_e2e':'HOLD','sealed_node_gate':'HOLD','final_release':'HOLD','deployed':False}
          pathlib.Path('evidence/source-lineage.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Run affected backend on isolated SQLite
        working-directory: restored
        shell: bash
        run: |
          ../isolated-runtime/bin/python -m pytest tests/test_depth29_trip_reentry.py tests/test_depth27_session_isolation.py tests/test_consumer_unified_lifecycle.py tests/test_master03_closure.py tests/test_sprint3e_unified_trips.py tests/test_depth05_money_retries.py tests/test_depth19_travel_facts.py tests/test_depth20_api_fulfillment.py tests/test_depth21_refund_recovery.py tests/test_depth22_rail_resolution.py tests/test_depth23_capacity.py tests/test_depth24_expiry.py --junitxml=../evidence/backend.xml | tee ../evidence/backend.log
      - name: Run frontend and native pure-function contracts
        working-directory: restored
        shell: bash
        run: |
          node --experimental-strip-types --test --test-reporter=spec --test-reporter-destination=../evidence/frontend.log --test-reporter=junit --test-reporter-destination=../evidence/frontend.xml tests_frontend/*.test.mjs
          cat ../evidence/frontend.log
      - name: Archive original scoped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GO-DEPTH29-isolated-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
