name: C13 developer-side flight first test

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/c13-flight-development.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c13-flight-source-bound:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: go_c11_isolated
          POSTGRES_USER: go_ci
          POSTGRES_PASSWORD: isolated_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U go_ci -d go_c11_isolated"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GO_C11_RUNTIME_DATABASE_URL: postgresql+psycopg://go_ci:isolated_ci_only@127.0.0.1:5432/go_c11_isolated
      GO_C11_SOURCE_COMMIT: d4376d6ae9a58eca3c7c32968ec96dffc5574122
      C13_EXPECTED_APPLICATION_TREE: bee89f356a43bf3445d2da3f60f64f7db02a28cd
    steps:
      - name: Checkout exact frozen PR240 candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: d4376d6ae9a58eca3c7c32968ec96dffc5574122
      - name: Refuse a moved or mismatched source
        run: |
          test "$(git rev-parse HEAD)" = "$GO_C11_SOURCE_COMMIT"
          test "$(git rev-parse HEAD:application)" = "$C13_EXPECTED_APPLICATION_TREE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test dependencies
        working-directory: application
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run frozen flight regression and PostgreSQL recovery scope
        working-directory: application
        env:
          PYTHONPATH: src:.
        run: |
          mkdir -p "$RUNNER_TEMP/go-c13-flight"
          pytest -q --junitxml="$RUNNER_TEMP/go-c13-flight/JUNIT.xml" tests/payments/test_c11_flight_idempotency_recovery.py tests/test_depth48_flight_changes.py
          PYTHONPATH=src python -B ci/next_depth/c11_postgres.py --evidence-dir "$RUNNER_TEMP/go-c13-flight"
      - name: Bind raw developer-side evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'go-c13-flight'; out.mkdir(exist_ok=True)
          scope=['pytest -q tests/payments/test_c11_flight_idempotency_recovery.py tests/test_depth48_flight_changes.py',
                 'python -B ci/next_depth/c11_postgres.py --evidence-dir $RUNNER_TEMP/go-c13-flight']
          scope_bytes=json.dumps(scope,sort_keys=True,separators=(',',':')).encode()
          report={'candidate_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'application_tree':subprocess.check_output(['git','rev-parse','HEAD:application'],text=True).strip(),
                  'test_scope_sha256':hashlib.sha256(scope_bytes).hexdigest(), 'scope':scope,
                  'scope_workflow_head':os.environ['GITHUB_SHA'],
                  'environment':'developer-side disposable GitHub Actions PostgreSQL 18.4',
                  'C13':'EVIDENCE_ONLY_PENDING_INDEPENDENT_REVIEW', 'C14':'NOT_EXECUTED',
                  'hong_kong':'NOT_ACCESSED', 'deployment':'NOT_REQUESTED', 'production':'HOLD'}
          report['files']={str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest()
                           for p in sorted(out.rglob('*')) if p.is_file()}
          (out/'C13_SOURCE_BINDING.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c13-dev-flight-pr240-d4376d6a
          path: ${{ runner.temp }}/go-c13-flight
          if-no-files-found: error
          retention-days: 90
