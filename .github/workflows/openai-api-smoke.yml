name: OpenAI API Smoke

on:
  push:
    branches:
      - ops/openai-api-smoke-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Minimal Responses API call
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          code=$(curl -sS -o response.json -w '%{http_code}' \
            https://api.openai.com/v1/responses \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"model":"gpt-5.6-sol","input":"Reply with exactly: OK","max_output_tokens":8}')
          echo "HTTP_STATUS=${code}"
          cat response.json
          test "$code" = "200"
          grep -q 'OK' response.json
