# GO Runtime Host local bridge directories.
# Install as /etc/tmpfiles.d/go-runtime-host-bridge.conf and apply with
#   systemd-tmpfiles --create /etc/tmpfiles.d/go-runtime-host-bridge.conf
# The set-group-id bit makes the group ownership deterministic for newly created
# files on both sides of the handoff, so the documented file modes hold without any
# privileged post-processing.
d /var/lib/go-runtime-bridge 0750 root go-runtime -
d /var/lib/go-runtime-bridge/inbox 2750 root go-runtime -
d /var/lib/go-runtime-bridge/outbox 2750 go-runtime root -
