# GO Runtime Host C1 AI worker directories.
# Install as /etc/tmpfiles.d/go-runtime-host-c1-worker.conf and apply with
#   systemd-tmpfiles --create /etc/tmpfiles.d/go-runtime-host-c1-worker.conf
#
# Both directories are owned by the account the worker runs as, and are reachable by
# nobody else. That is deliberate and it is what makes the credential path work: the
# token loader refuses a file that is group- or other-readable, so the only compliant
# arrangement is a single-owner file inside a directory that same owner can traverse.
# Do NOT widen either one - a group-readable token is refused at runtime by design.
d /etc/go-runtime-c1 0700 go-runtime go-runtime -
d /var/lib/go-runtime-c1 0700 go-runtime go-runtime -
